function removeScoreExam(exam){
  const lib=readScoreLibrary();
  for(const stu of Object.keys(lib.mocks||{})){
    if(lib.mocks[stu])delete lib.mocks[stu][exam];
    if(lib.mocks[stu]&&!Object.keys(lib.mocks[stu]).length)delete lib.mocks[stu];
  }
  delete lib.imports[exam];
  writeScoreLibrary(lib);

  let d={};try{d=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(_){}
  for(const stu of Object.keys(d.mocks||{})){
    if(d.mocks[stu])delete d.mocks[stu][exam];
    if(d.mocks[stu]&&!Object.keys(d.mocks[stu]).length)delete d.mocks[stu];
  }
  localStorage.setItem(KEY,JSON.stringify(d));
}

// PIN 로그인은 등록 학생·상담 작업을 복원하되, 이후 추가된 모평·학평 성적을 지우지 않는다.

loginVault=async function(){
 const pw=normPw($("#loginPw").value);if(!pw)return;
 try{
   const pack=JSON.parse(localStorage.getItem(VAULT));let d;
   if(pack.mode==="gate"){if(simpleHash(pw)!==pack.hash)throw Error("bad password");d=pack.data;}
   else d=await decryptObj(pack,pw);
   // 읽기/병합은 원본 상태를 변경하기 전에 수행한다.
   const liveLocal=getLocalState();
   const savedLocal=d.localState||{notes:d.notes||{},changes:d.changes||[],manualEvents:d.manualEvents||[]};
   const libKey=scoreLibraryKey();
   const libraryExists=localStorage.getItem(libKey)!==null;
   const restoredLocal={...savedLocal,...liveLocal};
   // 과거 PIN 저장본보다 이후 PDF 업로드·수동 보정 결과가 우선이다.
   restoredLocal.mocks=mergeDeepMocks(savedLocal.mocks||{},liveLocal.mocks||{});
   localStorage.setItem(KEY,JSON.stringify(restoredLocal));
   // PIN 저장 당시의 성적 라이브러리가 최신 라이브러리를 덮어쓰지 않도록 한다.
   if(!libraryExists && d.scoreLibrary)writeScoreLibrary(d.scoreLibrary);
   S.rows=d.rows||[];S.file=d.file||"저장된 작업";S.changes=d.changes||[];
   S.manualEvents=restoredLocal.manualEvents||d.manualEvents||[];
   buildStudents();openApp();jumpCalendarToData();render();
 }catch(e){toast("PIN 로그인 또는 저장자료 복원에 실패했습니다: "+(e.message||e),"bad")}
};

// 같은 대학+전형유형+전형명+세부유형 내 일정이 일치할 때만 보완

function scheduleGroupKey(r){
  return [
    String(r.university||"").trim(),
    String(r.kind||"").trim(),
    String(r.admission||"").trim(),
    String(r.detail||"").trim(),
    String(r.selection||"").trim()
  ].join("¦");
}
function normalizedScheduleRaw(v){
  return String(v||"").trim().replace(/\s+/g," ");
}
function inferredScheduleValue(r,field){
  const direct=normalizedScheduleRaw(r[field]);
  if(direct)return {value:direct,inferred:false,support:0};

  const key=scheduleGroupKey(r);
  const peers=S.rows.filter(x=>x!==r && scheduleGroupKey(x)===key);
  const vals=peers
    .map(x=>({row:x,value:normalizedScheduleRaw(x[field])}))
    .filter(x=>x.value);

  if(!vals.length)return {value:"",inferred:false,support:0};

  // 값이 하나라도 다르면 자동 보완하지 않음.
  const unique=[...new Set(vals.map(x=>x.value))];
  if(unique.length!==1)return {value:"",inferred:false,support:0};

  // 안전장치:
  // ① 같은 모집단위의 직접 근거가 있거나
  // ② 동일 그룹에서 2건 이상 같은 날짜가 확인될 때만 보완.
  const sameMajor=vals.filter(x=>String(x.row.major||"").trim()===String(r.major||"").trim());
  if(sameMajor.length<1 && vals.length<2)return {value:"",inferred:false,support:0};

  return {value:unique[0],inferred:true,support:vals.length};
}

allEvents=function(){
 let a=[];
 S.rows.forEach(r=>{
  [
   ["면접","interview","interview"],
   ["실기","practical","practical"],
   ["논술","essay","essay"],
   ["적성","aptitude","aptitude"],
   ["1단계 발표","announce1","announce"],
   ["최종발표","announce","announce"]
  ].forEach(([t,field,c])=>{
   const sched=inferredScheduleValue(r,field);
   parseScheduleDates(sched.value).forEach(date=>{
    a.push({
      date,type:t,cls:c,title:`${r.university} · ${r.name}`,row:r,
      rawDate:sched.value,inferred:sched.inferred,inferSupport:sched.support
    });
   });
  });
 });
 (S.manualEvents||[]).forEach((x,i)=>a.push({...x,cls:"memo",manual:i,inferred:false}));
 return a.filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x.date)).sort((a,b)=>a.date.localeCompare(b.date));
};

const JCAL_STORE='jinhakon.calendar.master.v1';
let jcalOverride=null,jcalFile=null,jcalFilter='';
function jcalMasterRows(){
  if(jcalOverride)return jcalOverride;
  try{const p=JSON.parse(localStorage.getItem(JCAL_STORE)||'null');if(p&&p.year===Number(CFG.schoolYear)&&Array.isArray(p.data))return p.data}catch(_){}
  return Number(CFG.schoolYear)===2027?JCAL_PRESET_2027:[];
}
function jcalKey(u,d,m){return [u,d,m].map(s=>String(s||'').trim()).join('\u241f')}
function jcalNormalizedName(u){
  u=String(u||'').trim().replace(/\s+/g,' ');
  return u.replace(/대학교(?=\(|$)/g,'대').replace(/교육대(?=\(|$)/g,'교육대')
          .replace(/과학기술원(?=\(|$)/g,'과기원').replace(/\((?:부산|서울|수원|성남|대구|경산|울산|창원|전주|대전|청주|광주|춘천|원주|김해|진주)\)$/,'');
}
function jcalDate(s){
  s=String(s||'').trim();if(!s)return '';
  const hits=[...s.matchAll(/(20\d\d)[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/g)];
  if(!hits.length)return '';
  const d=hits.map(m=>`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`);
  if(new Set(d).size!==1)return ''; // Date ranges must not be misrepresented as one announcement date.
  const x=new Date(d[0]+'T00:00:00');
  return !isNaN(x)&&x.getFullYear()===Number(d[0].slice(0,4))?d[0]:'';
}
function jcalData(){
  const m=new Map(jcalMasterRows().map(a=>[jcalKey(a[0],a[1],a[2]),a]));
  const dates=new Map(),missing=[],tot={step:0,final:0,source:0,stepExpected:0};
  for(let i=0;i<S.rows.length;i++){
    const r=S.rows[i],key=jcalKey(r.university,r.detail,r.major),item=m.get(key);
    if(item)tot.source++;
    const staged=/단계별|다단계/.test(String(item?.[5]||'')+' '+String(r.selection||'')+' '+String(r.admission||''))||Boolean(jcalDate(item?.[3]||r.announce1));
    if(staged)tot.stepExpected++;
    const sd=item?jcalDate(item[3]):jcalDate(r.announce1),fd=item?jcalDate(item[4]):jcalDate(r.announce);
    for(const [d,k] of [[sd,'1단계'],[fd,'최종']]){
      if(!d)continue;
      const mapkey=d+'|'+k;if(!dates.has(mapkey))dates.set(mapkey,{date:d,kind:k,names:new Set(),items:[]});
      dates.get(mapkey).names.add(jcalNormalizedName(r.university));
      dates.get(mapkey).items.push({university:r.university,detail:r.detail||r.admission,major:r.major});
      if(k==='1단계')tot.step++;else tot.final++;
    }
    if(!sd&&staged)missing.push({r,kind:'1단계'});
    if(!fd)missing.push({r,kind:'최종'});
  }
  const daymap=new Map();
  for(const ev of dates.values()){
    const names=[...ev.names].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
    const message=`[${ev.kind}] ${names.join(', ')}`;
    if(!daymap.has(ev.date))daymap.set(ev.date,[]);
    daymap.get(ev.date).push({kind:ev.kind,names,message,items:ev.items});
  }
  const sorted=[...daymap].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,events])=>({date,events:events.sort((a,b)=>a.kind==='1단계'?-1:1)}));
  return {days:sorted,missing,tot};
}

  if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}
}
function jcalRender(){

async function jcalImportMaster(file){
 if(!file)return;
 try{
  const matrix=await jFixReadTabular(file);
  const hidx=matrix.findIndex(r=>r.includes('지원 대학')&&r.includes('전형명')&&r.includes('1단계 발표일')&&r.includes('최종 발표일'));
  if(hidx<0)throw Error('대조표의 필수 열(지원 대학·전형명·모집단위·발표일)을 찾지 못했습니다.');
  const H=Object.fromEntries(matrix[hidx].map((x,i)=>[String(x||'').trim(),i]));
  const next=new Map();
  for(const row of matrix.slice(hidx+1)){
   const v=x=>String(row[H[x]]||'').trim();const u=v('지원 대학'),de=v('전형명'),major=v('모집단위');
   const rowYear=v('학년도');
   if(rowYear && Number(rowYear)!==Number(CFG.schoolYear))throw Error(`학년도 불일치: ${rowYear}학년도 자료입니다. 현재 설정은 ${CFG.schoolYear}학년도입니다.`);
   if(!u||!major)continue;
   const k=jcalKey(u,de,major),s=jcalDate(v('1단계 발표일')),f=jcalDate(v('최종 발표일'));
   if(!next.has(k))next.set(k,[u,de,major,s,f,v('선발 방식')]);
   else{
    const a=next.get(k);
    if((a[3]&&s&&a[3]!==s)||(a[4]&&f&&a[4]!==f))throw Error('같은 대학·전형·학과의 발표일이 서로 다릅니다: '+u+' '+de);
    a[3]=a[3]||s;a[4]=a[4]||f;
   }
  }
  if(!next.size)throw Error('날짜 대조 데이터를 찾지 못했습니다.');
  jcalOverride=[...next.values()];
  try{localStorage.setItem(JCAL_STORE,JSON.stringify({year:Number(CFG.schoolYear),data:jcalOverride}))}catch(_){}
  jcalRender();toast(`발표일 대조표 ${next.size}개 대학·전형·학과 연결`, 'good');
 }catch(e){alert('발표일 대조표를 읽지 못했습니다.\n'+e.message)}
}

let jcalSqlPromise=null;
function jcalLoadSql(){
 if(jcalSqlPromise)return jcalSqlPromise;
 jcalSqlPromise=(async()=>{
  // Electron/Windows packaged build ships sql-asm.js inside vendor; no network or WASM fetch.
  const candidates=[
   {url:'./vendor/sql-asm.js',offline:true},
   {url:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js',base:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'},
   {url:'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js',base:'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/'}
  ];
  for(const c of candidates){
   try{
    if(typeof initSqlJs!=='function'){
      await new Promise((resolve,reject)=>{
       const script=document.createElement('script');script.src=c.url;
       script.onload=resolve;
       script.onerror=()=>{script.remove();reject(Error('SQLite 엔진을 읽을 수 없음'))};
       document.head.appendChild(script);
      });
    }
    if(typeof initSqlJs==='function'){
       // sql-asm.js does not need locateFile; sql-wasm.js uses locateFile.
       return await initSqlJs(c.offline?{}:{locateFile:file=>c.base+file});
    }
   }catch(e){/* try the next source, allowing recovery after an offline failure */}
  }
  throw Error('SQLite 엔진을 실행하지 못했습니다. 설치판을 이용하거나 인터넷 연결 후 다시 시도하세요.');
 })().catch(e=>{jcalSqlPromise=null;throw e});
 return jcalSqlPromise;
}
function jcalRemoveOldText(content){
 const marker='【2027학년도 수시 발표';
 let text=String(content||'');
 if(text.includes(marker))text=text.split(marker,1)[0];
 return text.split(/\r?\n/).filter(x=>!/^\s*\[(?:1단계|최종)\]\s*/.test(x)).join('\n').trimEnd();
}
async function jcalExportDb(){
 if(!jcalFile)return alert('먼저 CalendarTask의 원본 calendar.db를 선택하세요.');
 const d=jcalData();if(!d.days.length)return alert('확인된 발표 날짜가 없습니다.');
 const btn=document.querySelector('#caldbView .primary');if(btn){btn.disabled=true;btn.textContent='DB 생성 중';}
 let db;
 try{
  const SQL=await jcalLoadSql(),raw=new Uint8Array(await jcalFile.arrayBuffer());
  if(raw.length<100||new TextDecoder('ascii').decode(raw.slice(0,15))!=='SQLite format 3')throw Error('SQLite 형식의 CalendarTask DB를 선택하세요.');
  db=new SQL.Database(raw);
  const tables=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='item_table'");
  if(!tables.length||!tables[0].values.length)throw Error('CalendarTask item_table이 없는 DB 파일입니다.');
  db.run('BEGIN IMMEDIATE');
  const result=db.exec('SELECT it_id,it_unique_id,it_content,it_history FROM item_table');
  const list=result[0]?.values||[],index=new Map(),existing=new Set();
  for(const [id,uid,content,history] of list){
    const m=/^dkcal_mdays_(\d{8})$/.exec(String(uid||''));if(!m)continue;
    const date=m[1].slice(0,4)+'-'+m[1].slice(4,6)+'-'+m[1].slice(6,8);
    index.set(date,{id,content:String(content||''),history:String(history||'')});existing.add(id);
  }
  const summary=new Map(d.days.map(x=>[x.date,x.events.map(e=>e.message).join('\n')]));
  for(const [date,v] of index){
    const old=jcalRemoveOldText(v.content),newtext=summary.get(date)||'';
    const combined=[old,newtext].filter(Boolean).join('\n');
    if(combined!==v.content){
      if(!combined && !v.history){db.run('DELETE FROM item_table WHERE it_id=?',[v.id]);}
      else db.run('UPDATE item_table SET it_content=?,it_mdate=datetime(\'now\',\'localtime\') WHERE it_id=?',[combined,v.id]);
    }
    summary.delete(date);
  }
  for(const [date,contents] of summary){
   const uid='dkcal_mdays_'+date.replaceAll('-','');
   db.run("INSERT INTO item_table(it_unique_id,it_content,it_cdate,it_mdate) VALUES(?,?,datetime('now','localtime'),datetime('now','localtime'))",[uid,contents]);
  }
  db.run('COMMIT');
  const check=db.exec('PRAGMA integrity_check');
  if(check[0]?.values?.[0]?.[0]!=='ok')throw Error('DB 무결성 확인에 실패했습니다.');
  const bytes=db.export();
  jcalDownload(new Blob([bytes],{type:'application/octet-stream'}),`진학ON_${CFG.schoolYear}학년도_합격발표_전체대학.db`);
  toast(`발표 ${d.days.length}일 반영 · 개인 일정 보존`, 'good');
 }catch(e){try{db?.run('ROLLBACK')}catch(_){}alert('DB 생성 실패\n'+e.message+'\n\nCalendarTask 원본 calendar.db를 확인하고 다시 시도하세요.');}
 finally{try{db?.close()}catch(_){}if(btn){btn.disabled=false;btn.textContent='CalendarTask DB 생성'}}
}

function jFixLegacyGroups(){
 const groups=new Map();
 for(const r of S.rows){
   const legacy=legacyAppKey(r),newKey=appKey(r);
   if(!groups.has(legacy))groups.set(legacy,new Map());
   groups.get(legacy).set(newKey,r);
 }
 return groups;
}
function jFixMigrateState(){
 if(!S.rows.length)return;
 const d=loadLocal();
 d.results=d.results||{};d.stages=d.stages||{};
 d.migrationDecisions=d.migrationDecisions||{};
 d.migrationReview=d.migrationReview||{};
 for(const [legacy,candidates] of jFixLegacyGroups()){
   const hasResult=Object.prototype.hasOwnProperty.call(d.results,legacy);
   const hasStages=Object.prototype.hasOwnProperty.call(d.stages,legacy);
   if(!hasResult&&!hasStages)continue;
   if(d.migrationDecisions[legacy]){delete d.migrationReview[legacy];continue;}
   if(candidates.size===1){
     const target=[...candidates.keys()][0];
     if(hasResult && !Object.prototype.hasOwnProperty.call(d.results,target))d.results[target]=d.results[legacy];
     if(hasStages){
       d.stages[target]=d.stages[target]||{};
       for(const [field,value] of Object.entries(d.stages[legacy]||{})){
         if(!Object.prototype.hasOwnProperty.call(d.stages[target],field))d.stages[target][field]=value;
       }
     }
     d.migrationDecisions[legacy]=target;
     delete d.migrationReview[legacy];
   }else{
     d.migrationReview[legacy]={
       year:CFG.schoolYear,
       result:hasResult?d.results[legacy]:"",
       stages:hasStages?d.stages[legacy]:{},
       candidates:[...candidates.keys()]
     };
   }
 }
 // 구버전 키는 안전을 위해 삭제하지 않습니다.
 localStorage.setItem(KEY,JSON.stringify(d));
}

 const row=S.rows.find(r=>appKey(r)===target);
 if(!row)return;
 const chosen=`${row.university} / ${exactAdmission(row)} / ${row.major}`;
 if(!confirm(`기존 결과 기록을 다음 지원 전형으로 옮길까요?\n\n${chosen}\n\n다른 전형의 결과는 추정해서 입력하지 않습니다.`))return;
 d.results=d.results||{};d.stages=d.stages||{};
 if(entry.result && !d.results[target])d.results[target]=entry.result;
 d.stages[target]=d.stages[target]||{};
 for(const [k,v] of Object.entries(entry.stages||{})){
  if(!d.stages[target][k])d.stages[target][k]=v;
 }
 d.migrationDecisions=d.migrationDecisions||{};d.migrationDecisions[legacy]=target;
 delete d.migrationReview[legacy];

 render();toast('기존 결과를 선택한 전형으로 연결했습니다.','good');
}

function jFixChooseByIndex(index){
 const r=S.rows[index];if(!r)return;
 jFixApplyLegacy(legacyAppKey(r),appKey(r));

// CSV도 발표일 양식으로 쓸 수 있도록 지원합니다.
function jFixParseCsv(t){
 const src=String(t||'').replace(/^\uFEFF/,''),out=[];
 let row=[],field='',quote=false;
 for(let i=0;i<src.length;i++){
  const c=src[i];
  if(c==='"'){
    if(quote&&src[i+1]==='"'){field+='"';i++}else quote=!quote;
  }else if(c===','&&!quote){row.push(field);field=''}
  else if((c==='\n'||c==='\r')&&!quote){
    if(c==='\r'&&src[i+1]==='\n')i++;
    row.push(field);if(row.some(x=>x.trim()))out.push(row);row=[];field='';
  }else field+=c;
 }
 if(quote)throw Error('CSV 따옴표가 닫히지 않았습니다.');
 row.push(field);if(row.some(x=>x.trim()))out.push(row);
 return out;
}
async function jFixReadTabular(file){
 return /\.csv$/i.test(file.name)?jFixParseCsv(await file.text()):await readXlsx(file);
}

 const blob=new Blob([content],{type:'text/csv;charset=utf-8'});

}
