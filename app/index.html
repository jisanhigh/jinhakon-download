<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진학ON · 고3 진학업무 통합관리</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7485;--line:#e4e9f1;--nav:#18243a;--accent:#315fce;--good:#17795b;--warn:#b66b10;--bad:#c3424f;--soft:#eef3ff}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
#gate{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#eef3fb,#f8fafc)}
.gate-card{width:min(760px,94vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:42px;box-shadow:0 20px 60px #24324d1a}
.brand{display:flex;align-items:center;gap:14px}.mark{width:52px;height:52px;border-radius:15px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:var(--muted)}
.drop{margin-top:28px;border:2px dashed #b9c6dc;border-radius:18px;padding:34px;text-align:center;background:#fafcff;transition:.15s}
.drop.over{border-color:var(--accent);background:#f1f5ff}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:var(--muted)}
.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.gate-actions{display:flex;justify-content:center;gap:8px;margin-top:18px}.notice{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
.app{min-height:100vh}.top{height:68px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 22px;gap:18px;position:sticky;top:0;z-index:20}
.top .logo{font-weight:900;font-size:21px;letter-spacing:-.5px}.top .file{font-size:12px;color:#bac5d7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.top button{background:#253653;border:1px solid #3b4d6b;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:68px;height:calc(100vh - 68px)}
.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:10px;color:#495368;font-weight:700;cursor:pointer;margin-bottom:4px}.navbtn.on{background:var(--soft);color:var(--accent)}
.main{padding:22px;min-width:0}.view{display:none}.view.on{display:block}.pagehead{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.pagehead h2{margin:0;font-size:23px}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.kpi small{color:var(--muted);font-weight:700}.kpi b{display:block;font-size:28px;margin-top:5px}.kpi em{font-size:13px;font-style:normal;color:var(--muted);margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.card h3{margin:0 0 13px;font-size:15px}
.barrow{display:grid;grid-template-columns:115px 1fr 42px;align-items:center;gap:8px;margin:10px 0;font-size:13px}.bar{height:9px;background:#edf0f5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#697386;background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 9px;white-space:nowrap}td{border-bottom:1px solid #edf0f4;padding:10px 9px;vertical-align:top}tbody tr:hover{background:#fafcff}.click{cursor:pointer}
.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef2f8;color:#536078}.badge.good{background:#e9f7f1;color:var(--good)}.badge.warn{background:#fff3e3;color:var(--warn)}.badge.bad{background:#ffedf0;color:var(--bad)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid #d8dee9;border-radius:9px;padding:9px 10px;background:#fff}
.student-layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.list{height:calc(100vh - 190px);overflow:auto}.stu{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.stu:hover,.stu.on{background:#f1f5ff}.stu b{display:block}.stu small{color:var(--muted)}
.detail-empty{display:grid;place-items:center;min-height:400px;color:var(--muted)}
.student-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.student-head h2{margin:0}.student-head .meta{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{border:0;background:transparent;padding:10px 12px;font-weight:800;color:#6d7688;cursor:pointer}.tab.on{color:var(--accent);border-bottom:3px solid var(--accent)}
.tabpane{display:none}.tabpane.on{display:block}.req{margin-top:10px;padding:13px;border-radius:10px;background:#f7f9fc;white-space:pre-wrap;line-height:1.55;font-size:12px;color:#4e596d}
textarea{width:100%;min-height:110px;border:1px solid #d8dee9;border-radius:10px;padding:11px;resize:vertical}.timeline{margin-top:14px}.event{border-left:3px solid #d8e1f5;padding:4px 0 14px 13px}.event b{font-size:13px}.event small{color:var(--muted);margin-left:7px}.event p{margin:6px 0 0;font-size:13px;white-space:pre-wrap}
.todo{display:flex;gap:6px;flex-wrap:wrap}.search{min-width:220px}
.modal{position:fixed;inset:0;background:#0e1726a8;display:none;place-items:center;z-index:50;padding:20px}.modal.on{display:grid}.modal-card{width:min(720px,96vw);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal-card h3{margin-top:0}.modal-close{float:right}
@media(max-width:1050px){.shell{grid-template-columns:78px 1fr}.navbtn{font-size:0;text-align:center}.navbtn::first-letter{font-size:18px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.student-layout{grid-template-columns:240px 1fr}}
@media print{.top,.side,.toolbar,.tabs,.no-print{display:none!important}.shell{display:block}.main{padding:0}.view{display:none!important}#studentView.on{display:block!important}.card{border:0}.student-layout{display:block}.list{display:none}.req{background:#fff;border:1px solid #ddd}}

/* v2 */
.gate-login{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.login-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.login-row input{border:1px solid #d8dee9;border-radius:10px;padding:10px 12px;min-width:210px}
.calbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calbar h3{margin:0;font-size:19px}.calnav{display:flex;gap:6px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}
.dow,.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dow{text-align:center;padding:9px;font-size:12px;font-weight:800;color:#6c7689;background:#f8fafc}.dow.sun{color:#c3424f}.dow.sat{color:#315fce}
.day{min-height:118px;padding:7px;cursor:pointer;overflow:hidden}.day:hover{background:#fafcff}.day.out{background:#fafbfc;color:#a8afbb}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}.day.sel{background:#f1f5ff}.dnum{font-size:12px;font-weight:800;margin-bottom:5px}
.ev{display:block;border-radius:5px;padding:3px 5px;margin:3px 0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eef2f8}.ev.interview{background:#fff0df;color:#99570a}.ev.practical{background:#f1e9ff;color:#6841a5}.ev.essay{background:#ffeaed;color:#a9303e}.ev.aptitude{background:#e8f2ff;color:#2e5f9b}.ev.announce{background:#e8f5ef;color:#146b50}.ev.memo{background:#eeeaff;color:#6545ad}
.statfilters{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;cursor:pointer;font-size:12px}.pill.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.blind .pname{filter:none!important}
.savehint{font-size:11px;color:var(--muted);margin-top:7px}.result-select{border:1px solid #d8dee9;border-radius:7px;padding:5px 7px;background:#fff;font-size:12px}
@media(max-width:760px){.calendar{font-size:10px}.day{min-height:90px}.kpis{grid-template-columns:1fr 1fr}.student-layout{display:block}.list{height:260px;margin-bottom:12px}}

.focusgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.focusitem{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.focusitem b{font-size:22px;display:block;margin-top:4px}.minirow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0f4;font-size:13px}.minirow:last-child{border-bottom:0}.dangerline{border-left:4px solid var(--bad)}.warnline{border-left:4px solid var(--warn)}.goodline{border-left:4px solid var(--good)}
@media(max-width:900px){.focusgrid{grid-template-columns:1fr}}

/* ===== v4 readability redesign ===== */
:root{--bg:#f5f7fb;--card:#fff;--ink:#182235;--muted:#657087;--line:#dfe5ee;--nav:#16233a;--accent:#315fc9;--soft:#edf3ff}
body{font-size:15px;letter-spacing:-.15px}
.top{height:72px;padding:0 28px;gap:20px}.top .logo{font-size:23px}.top .file{font-size:13px}.top button{font-size:14px;padding:10px 14px}
.shell{grid-template-columns:226px 1fr;min-height:calc(100vh - 72px)}
.side{top:72px;height:calc(100vh - 72px);padding:22px 14px}.navbtn{padding:14px 15px;font-size:15px;margin-bottom:5px;border-radius:11px}
.main{padding:28px 30px;max-width:1700px;width:100%;margin:0 auto}.pagehead{margin-bottom:21px}.pagehead h2{font-size:26px;letter-spacing:-.7px}.pagehead p{font-size:14px;margin-top:7px}
.kpis{gap:14px}.kpi{padding:20px;border-radius:15px}.kpi small{font-size:13px}.kpi b{font-size:31px;margin-top:7px}
.card{padding:20px;border-radius:15px;box-shadow:0 1px 2px #15213a08}.card h3{font-size:17px;margin-bottom:16px}
.grid2{gap:16px;margin-top:16px}
table{font-size:14px}th{padding:12px 11px;font-size:13px}td{padding:13px 11px;line-height:1.5}
.badge{font-size:12px;padding:5px 9px}
.toolbar input,.toolbar select{padding:11px 12px;font-size:14px}.search{min-width:250px}
.student-layout{grid-template-columns:315px minmax(0,1fr);gap:18px}.list{height:calc(100vh - 220px)}
.stu{padding:14px 12px}.stu b{font-size:15px;margin-bottom:4px}.stu small{font-size:12px}
.student-head{margin-bottom:16px}.student-head h2{font-size:26px}.student-head .meta{font-size:14px}
.tabs{gap:10px}.tab{font-size:14px;padding:12px 14px}.req{font-size:13px;padding:15px}

.gate-card{width:min(680px,94vw);padding:46px 48px;border-radius:22px}.brand h1{font-size:31px}.brand p{font-size:14px}.drop{margin-top:30px;padding:42px 30px}.drop strong{font-size:20px}.drop span{font-size:14px}.gate-actions{margin-top:20px}.gate-actions .primary{font-size:15px;padding:13px 20px}
.notice{font-size:12px;margin-top:20px}
.calendar{border-radius:12px;overflow:hidden}.dow{padding:12px;font-size:13px}.day{min-height:150px;padding:9px}.dnum{font-size:14px;margin-bottom:7px}.ev{font-size:13px;line-height:1.35;padding:5px 7px;margin:4px 0;border-radius:6px}.calbar h3{font-size:22px}
.focusitem{padding:16px}.focusitem small{font-size:13px}.focusitem b{font-size:27px}
@media(max-width:1100px){.shell{grid-template-columns:190px 1fr}.navbtn{font-size:14px}.main{padding:22px}.student-layout{grid-template-columns:270px 1fr}.day{min-height:125px}.ev{font-size:12px}}


/* ===== v5 Admin / maintainability ===== */
.setting-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.setting-menu{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;height:max-content;position:sticky;top:96px}
.setting-menu button{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:9px;font-weight:700;color:#596479;cursor:pointer}
.setting-menu button.on{background:var(--soft);color:var(--accent)}
.setting-pane{display:none}.setting-pane.on{display:block}
.form-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:16px}
.form-card h3{margin:0 0 6px;font-size:18px}.form-card>p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}
.form-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid #eef1f5}
.form-row:last-child{border-bottom:0}.form-row label{font-weight:700;font-size:14px}.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #d6dde8;border-radius:9px;padding:10px 11px;background:#fff}
.form-row textarea{min-height:86px}
.mapping-table select{min-width:170px;border:1px solid #d7deea;border-radius:8px;padding:8px;background:#fff}
.setting-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.versionbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.versionbox>div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:15px}
.versionbox small{color:var(--muted);display:block;margin-bottom:5px}.versionbox b{font-size:17px}
.helpbox{border-left:4px solid var(--accent);background:#f5f8ff;padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.7}
@media(max-width:900px){.setting-grid{grid-template-columns:1fr}.setting-menu{position:static;display:flex;overflow:auto}.setting-menu button{white-space:nowrap}.form-row{grid-template-columns:1fr;gap:7px}.versionbox{grid-template-columns:1fr}}


/* =========================================================
   진학ON v6 — independent visual system
   ========================================================= */
:root{
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface2:#f8faff;
  --ink:#18243a;
  --muted:#70809a;
  --line:#e3e9f2;
  --navy:#172744;
  --blue:#5c74c9;
  --blue2:#6e85da;
  --mint:#58a88f;
  --peach:#df8a6d;
  --lav:#8b76c9;
  --gold:#c99749;
  --rose:#cf6c79;
  --shadow:0 12px 36px rgba(38,55,87,.08);
  --shadow-lg:0 24px 70px rgba(25,39,67,.18);
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(circle at 85% -10%,rgba(105,126,208,.11),transparent 28%),
    radial-gradient(circle at -8% 18%,rgba(100,180,157,.08),transparent 25%),
    var(--bg);
  color:var(--ink);
  font-family:"Pretendard","SUIT","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px;
  letter-spacing:-.22px;
}
button,input,select,textarea{font-family:inherit}
button{transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}
button:active{transform:translateY(1px)}
/* entrance */
#gate{
  background:
    radial-gradient(circle at 70% 12%,rgba(116,139,221,.18),transparent 30%),
    linear-gradient(145deg,#f2f6fc 0%,#f8faff 52%,#eef4fb 100%);
}
.gate-card{
  width:min(720px,94vw);
  border:1px solid rgba(218,227,240,.9);
  border-radius:28px;
  padding:46px 50px 40px;
  box-shadow:0 30px 90px rgba(38,55,87,.13);
  position:relative;
  overflow:hidden;
}
.gate-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--blue),var(--lav),var(--mint));
}
.brand{justify-content:center;text-align:left}
.mark{
  width:58px;height:58px;border-radius:18px;
  background:linear-gradient(145deg,#435baf,#6f79c7 55%,#7b6db4);
  box-shadow:0 12px 26px rgba(72,91,167,.25);
  font-size:23px
}
.brand h1{font-size:32px;font-weight:900;letter-spacing:-1.2px}
.brand p{font-size:14px;color:#7a879b;font-weight:650}
.drop{
  margin-top:30px;padding:34px 28px;
  border:1.5px dashed #bdc9db;border-radius:20px;
  background:linear-gradient(180deg,#fbfcff,#f6f8fd);
}
.drop::before{
  content:"⇩";display:grid;place-items:center;margin:0 auto 13px;
  width:42px;height:42px;border-radius:13px;background:#edf2ff;color:var(--blue);
  font-size:22px;font-weight:900;
}
.drop strong{font-size:19px;letter-spacing:-.45px}.drop span{color:#738096;font-size:13px}
.drop.over{border-color:var(--blue);background:#f1f5ff;box-shadow:0 0 0 4px rgba(92,116,201,.08)}
.gate-actions .primary{
  min-width:150px;border-radius:12px;padding:13px 18px;
  background:linear-gradient(135deg,#5068bd,#687fd1);
  box-shadow:0 8px 20px rgba(80,104,189,.22)
}
.notice{color:#8a95a7}
/* chrome */
.top{
  height:76px;background:rgba(255,255,255,.93);color:var(--ink);
  border-bottom:1px solid rgba(222,228,238,.9);
  box-shadow:0 5px 24px rgba(32,47,75,.045);
  backdrop-filter:blur(18px);
  padding:0 28px;gap:12px
}
.top .logo{
  color:var(--navy);font-size:22px;font-weight:950;letter-spacing:-.8px;
  padding-right:20px;margin-right:6px;position:relative
}
.top .logo::before{
  content:"진";display:inline-grid;place-items:center;width:35px;height:35px;margin-right:10px;
  border-radius:11px;color:#fff;font-size:14px;vertical-align:middle;
  background:linear-gradient(145deg,#4c65ba,#8173c2);
  box-shadow:0 7px 16px rgba(72,91,167,.18)
}
.top .logo::after{content:"";position:absolute;right:0;top:3px;bottom:3px;width:1px;background:#e5eaf1}
.top .file{color:#8a96a8;font-size:12px;font-weight:600}
.top button{
  color:#55637a;background:#f8faff;border:1px solid #e0e7f0;
  border-radius:10px;padding:9px 12px;font-size:12px;font-weight:750;
}
.top button:hover{background:#eef3ff;border-color:#ccd8ef;color:#3f58a5;box-shadow:0 6px 15px rgba(54,75,120,.08)}
#focusBtn{background:#edf2ff!important;color:#4963b5!important;border-color:#d5dff4!important}
/* layout */
.shell{grid-template-columns:218px minmax(0,1fr)}
.side{
  background:rgba(250,252,255,.92);border-right:1px solid #e2e8f0;
  padding:22px 13px;top:76px;height:calc(100vh - 76px);backdrop-filter:blur(15px)
}
.navbtn{
  position:relative;padding:12px 13px 12px 42px!important;margin-bottom:5px;
  border-radius:11px!important;color:#69768a!important;font-size:14px!important;font-weight:780!important;
}
.navbtn::before{
  content:"";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border-radius:6px;background:#e9edf4;
  box-shadow:inset 0 0 0 1px #d9e0ea
}
.navbtn[data-view="dash"]::before{background:linear-gradient(135deg,#6c82d0,#8e9ce0)}
.navbtn[data-view="student"]::before{background:linear-gradient(135deg,#5ba58f,#82c0ad)}
.navbtn[data-view="univ"]::before{background:linear-gradient(135deg,#8d77c7,#a795d6)}
.navbtn[data-view="todo"]::before{background:linear-gradient(135deg,#db8c69,#e8aa8e)}
.navbtn[data-view="minimum"]::before{background:linear-gradient(135deg,#c59b4d,#d9b971)}
.navbtn[data-view="schedule"]::before{background:linear-gradient(135deg,#cf6c79,#df98a1)}
.navbtn[data-view="changes"]::before{background:linear-gradient(135deg,#77879c,#9ca9b8)}
.navbtn[data-view="admin"]::before{background:linear-gradient(135deg,#50637d,#7889a0)}
.navbtn:hover{background:#f0f4fb!important;color:#334157!important}
.navbtn.on{
  background:linear-gradient(90deg,#eaf0ff,#f4f6ff)!important;
  color:#425ba9!important;box-shadow:inset 3px 0 0 #6179ca
}
.main{padding:30px 32px 46px;max-width:1720px}
.pagehead{align-items:center;margin-bottom:20px}.pagehead h2{font-size:27px;font-weight:920;letter-spacing:-1px}.pagehead p{font-size:13px;color:#8490a4}
/* cards */
.card,.kpi{
  border:1px solid rgba(224,230,239,.95);
  background:rgba(255,255,255,.94);
  box-shadow:0 8px 28px rgba(44,61,92,.055);
}
.card{border-radius:17px;padding:20px}.card h3{font-size:16px;font-weight:900;color:#26334a}
.kpis{gap:13px}
.kpi{
  border-radius:16px;padding:18px 19px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;right:-24px;top:-28px;width:85px;height:85px;border-radius:50%;opacity:.08}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S={rows:[],students:[],file:"",selected:null,view:"dash",oldRows:[],changes:[]};
const KEY="jinhakON.v1";
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const val=(o,...ks)=>{for(const k of ks)if(o[k]!=null&&String(o[k]).trim()!=="")return String(o[k]).trim();return ""};
const studentKey=r=>[r.grade,r.ban,r.no,r.name].join("|");
// v1.0.6: 구형 키는 자료 이전 용도로만 사용합니다.
const legacyAppKey=r=>[studentKey(r),r.university,r.admission,r.major].join("|");
function exactAdmission(r){return String(r.detail||r.admission||r.kind||"").trim()}
function jFixNorm(v){return String(v??"").normalize("NFKC").replace(/\s+/g," ").trim()}
function jFixYear(r){return String(r.schoolYear || ((typeof CFG!=="undefined"&&CFG&&CFG.schoolYear)||new Date().getFullYear()+1))}
const appKey=r=>["JK2",jFixYear(r),studentKey(r),r.university,r.kind,r.admission,r.detail,r.major]
  .map(x=>encodeURIComponent(jFixNorm(x))).join("|");
let resultText=r=>r.final||r.step1||"";
let hasResult=r=>!!resultText(r);

function xmlDecode(s){const d=document.createElement("textarea");d.innerHTML=s;return d.value}
async function unzipXlsx(buffer){
 const b=new Uint8Array(buffer), dv=new DataView(buffer), sig=0x06054b50; let e=-1;
 for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--){if(dv.getUint32(i,true)===sig){e=i;break}}
 if(e<0)throw Error("올바른 xlsx 파일이 아닙니다.");
 const count=dv.getUint16(e+10,true), cd=dv.getUint32(e+16,true); let p=cd, files={};
 for(let n=0;n<count;n++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true);
  const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(b.slice(p+46,p+46+nl));
  const lnl=dv.getUint16(off+26,true), lel=dv.getUint16(off+28,true), start=off+30+lnl+lel, data=b.slice(start,start+csize);
  let out;
  if(method===0) out=data;
  else if(method===8){
   if(!("DecompressionStream" in window))throw Error("이 브라우저는 xlsx 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge를 사용하세요.");
   const ds=new DecompressionStream("deflate-raw"); out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
  } else {p+=46+nl+el+cl;continue}
  files[name]=out; p+=46+nl+el+cl;
 }
 return files;
}
function txt(files,name){if(!files[name])return "";return new TextDecoder("utf-8").decode(files[name])}
function parseXml(x){return new DOMParser().parseFromString(x,"application/xml")}
function colNum(ref){let m=(ref.match(/[A-Z]+/)||["A"])[0],n=0;for(const c of m)n=n*26+c.charCodeAt(0)-64;return n-1}
async function readXlsx(file){
 const files=await unzipXlsx(await file.arrayBuffer());
 let shared=[];
 const sx=txt(files,"xl/sharedStrings.xml");
 if(sx){const d=parseXml(sx);shared=[...d.getElementsByTagNameNS("*","si")].map(si=>[...si.getElementsByTagNameNS("*","t")].map(t=>t.textContent).join(""))}
 let sheetName="xl/worksheets/sheet1.xml";
 const wb=txt(files,"xl/workbook.xml"), rel=txt(files,"xl/_rels/workbook.xml.rels");
 if(wb&&rel){
  const wd=parseXml(wb), rd=parseXml(rel), sh=wd.getElementsByTagNameNS("*","sheet")[0];
  if(sh){const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
   const rr=[...rd.getElementsByTagNameNS("*","Relationship")].find(x=>x.getAttribute("Id")===rid);
   if(rr){let t=rr.getAttribute("Target");sheetName=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,"")}}
 }
 const xml=txt(files,sheetName); if(!xml)throw Error("첫 번째 워크시트를 읽지 못했습니다.");
 const d=parseXml(xml), matrix=[];
 for(const row of [...d.getElementsByTagNameNS("*","row")]){
  const arr=[];
  for(const c of [...row.getElementsByTagNameNS("*","c")]){
   const idx=colNum(c.getAttribute("r")||"A1"), type=c.getAttribute("t");
   let v="";
   if(type==="inlineStr"){v=[...c.getElementsByTagNameNS("*","t")].map(x=>x.textContent).join("")}
   else {const ve=c.getElementsByTagNameNS("*","v")[0];v=ve?ve.textContent:"";if(type==="s")v=shared[Number(v)]??v}
   arr[idx]=v;
  }
  matrix[Number(row.getAttribute("r")||matrix.length+1)-1]=arr;
 }
 return matrix;
}
function ingest(matrix,label){
 let hi=-1, H={};
 for(let i=0;i<Math.min(8,matrix.length);i++){
  const a=matrix[i]||[], score=["학년","반","번호","이름","대학명","모집단위"].filter(x=>a.includes(x)).length;
  if(score>=4){hi=i;H=Object.fromEntries(a.map((x,j)=>[String(x||"").trim(),j]).filter(x=>x[0]));break}
 }
 if(hi<0)throw Error("대교협 파일의 헤더(학년·반·번호·이름·대학명 등)를 찾지 못했습니다.");
 const g=(a,...names)=>{for(const n of names)if(H[n]!=null)return String(a[H[n]]??"").trim();return ""};
 const rows=[];
 for(let i=hi+1;i<matrix.length;i++){
  const a=matrix[i]||[]; if(!g(a,"이름"))continue;
  rows.push({grade:g(a,"학년"),ban:g(a,"반"),no:g(a,"번호"),name:g(a,"이름"),region:g(a,"지역"),university:g(a,"대학명"),
   kind:g(a,"전형유형"),admission:g(a,"전형명(대)"),detail:g(a,"세부유형"),track:g(a,"계열"),major:g(a,"모집단위"),
   quota:g(a,"모집인원"),minimum:g(a,"최저학력기준"),score:g(a,"내점수(환산)"),gpa:g(a,"내등급(환산)"),
   step1:g(a,"1단계"),final:g(a,"최종단계"),fail:g(a,"불합격사유"),register:g(a,"등록여부","등록"),
   interview:g(a,"면접일","면접","면접고사일","면접일자","면접고사"),
   practical:g(a,"실기일자","실기일","실기고사일","실기고사일자","실기고사"),
   essay:g(a,"논술일","논술","논술고사일","논술일자","논술고사"),
   aptitude:g(a,"적성일자","적성일","적성고사일","적성고사일자","적성고사"),
   announce1:g(a,"1단계발표일","1단계 발표일","1단계발표","1단계 발표"),
   announce:g(a,"최종발표일","최종 발표일","최종발표","최종 발표","합격자발표일","합격자 발표일")});
 }
 if(!rows.length)throw Error("지원 자료를 찾지 못했습니다.");
 const old=S.rows; S.oldRows=old; S.rows=rows; S.file=label; compare(old,rows); buildStudents(); saveSession(); openApp(); jumpCalendarToData(); render();
}
function compare(oldRows,newRows){
 if(!oldRows.length){S.changes=[];return}
 const o=new Map(oldRows.map(r=>[appKey(r),r])), n=new Map(newRows.map(r=>[appKey(r),r])), now=new Date().toLocaleString();
 const ch=[];
 for(const [k,r] of n)if(!o.has(k))ch.push({when:now,type:"신규",stu:`${r.ban}반 ${r.no}번 ${r.name}`,detail:`${r.university} · ${r.major} · ${r.admission}`});
 for(const [k,r] of o)if(!n.has(k))ch.push({when:now,type:"삭제",stu:`${r.ban}반 ${r.no}번 ${r.name}`,detail:`${r.university} · ${r.major} · ${r.admission}`});
 for(const [k,r] of n)if(o.has(k)){const a=o.get(k), fields=[["minimum","수능최저"],["gpa","환산등급"],["step1","1단계"],["final","최종"],["register","등록"]];
  const diff=fields.filter(([f])=>(a[f]||"")!==(r[f]||"")).map(x=>x[1]);if(diff.length)ch.push({when:now,type:"변경",stu:`${r.ban}반 ${r.no}번 ${r.name}`,detail:`${r.university} · ${r.major} (${diff.join(", ")})`})}
 S.changes=[...ch,...(loadLocal().changes||[])].slice(0,500);
}
function buildStudents(){
 const m=new Map(); for(const r of S.rows){const k=studentKey(r);if(!m.has(k))m.set(k,{key:k,grade:r.grade,ban:r.ban,no:r.no,name:r.name,apps:[]});m.get(k).apps.push(r)}
 S.students=[...m.values()].sort((a,b)=>(+a.ban-+b.ban)||(+a.no-+b.no)||a.name.localeCompare(b.name));
}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}
function notes(){return loadLocal().notes||{}}
function saveSession(){
 const old=loadLocal(); localStorage.setItem(KEY,JSON.stringify({notes:old.notes||{},changes:S.changes,file:S.file,savedAt:new Date().toISOString()}));
}
function saveNote(stu,cat,memo){
 const d=loadLocal(), n=d.notes||{}, k=stu.key; n[k]=n[k]||[]; n[k].unshift({day:new Date().toISOString().slice(0,10),cat,memo,created:Date.now()});
 d.notes=n; d.changes=S.changes; localStorage.setItem(KEY,JSON.stringify(d)); render();
}
function openApp(){$("#gate").classList.add("hidden");$("#app").classList.remove("hidden");if($("#fileLabel"))$("#fileLabel").textContent=S.file}
function switchView(v){S.view=v;$$(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.view===v));$$(".view").forEach(x=>x.classList.remove("on"));$("#"+v+"View").classList.add("on");render()}
function mix(){const m={};S.rows.forEach(r=>{let k=(r.kind||"기타").replace(/학생부위주\(|\)/g,"");m[k]=(m[k]||0)+1});return m}
function issueFor(stu){
 const ns=notes()[stu.key]||[], issues=[]; if(!ns.length)issues.push("상담기록 없음");
 const pending=stu.apps.filter(r=>!hasResult(r)).length;if(pending)issues.push(`결과 ${pending}건 미입력`);
 if(stu.apps.length<6)issues.push(`지원 ${stu.apps.length}건`);
 const complex=stu.apps.filter(r=>r.minimum && /평균|필수|제2외국어|과학탐구|모집인원|계열/.test(r.minimum)).length;if(complex)issues.push(`최저 원문 확인 ${complex}건`);
 return issues;
}
function render(){renderDash();renderStudent();renderUniv();renderTodo();renderSchedule();renderChanges()}
function renderDash(){
 const m=mix(), max=Math.max(1,...Object.values(m)), unis=new Set(S.rows.map(r=>r.university).filter(Boolean)).size, ns=notes();
 const coun=S.students.filter(x=>(ns[x.key]||[]).length).length, result=S.rows.filter(hasResult).length, issues=S.students.map(x=>[x,issueFor(x)]).filter(x=>x[1].length);
 const top=[...new Map([...new Set(S.rows.map(r=>r.university))].map(u=>[u,S.rows.filter(r=>r.university===u).length]))].sort((a,b)=>b[1]-a[1]).slice(0,8);
 $("#dashView").innerHTML=`<div class="pagehead"><div><h2>진학업무 대시보드</h2><p>대교협 자료를 담임 업무 관점으로 다시 정리합니다.</p></div></div>
 <div class="kpis">${[["학생",S.students.length,"명"],["지원 원서",S.rows.length,"건"],["지원 대학",unis,"곳"],["상담 기록",coun,"명"],["결과 입력",result,"건"]].map(x=>`<div class=kpi><small>${x[0]}</small><b>${x[1]}<em>${x[2]}</em></b></div>`).join("")}</div>
 <div class=grid2><div class=card><h3>전형별 지원현황</h3>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class=barrow><span>${esc(k)}</span><div class=bar><i style="width:${n/max*100}%"></i></div><b>${n}</b></div>`).join("")}</div>
 <div class=card><h3>지금 확인할 학생</h3><table><thead><tr><th>학생</th><th>확인사항</th></tr></thead><tbody>${issues.slice(0,12).map(([s,i])=>`<tr class=click onclick="pickStudent('${esc(s.key)}')"><td>${s.ban}반 ${s.no}번 ${esc(s.name)}</td><td class=todo>${i.map(x=>`<span class="badge ${x.includes("없음")?"bad":"warn"}">${esc(x)}</span>`).join("")}</td></tr>`).join("")||`<tr><td colspan=2>확인할 항목이 없습니다.</td></tr>`}</tbody></table></div>
 <div class=card><h3>대학별 원서 TOP</h3>${top.map(([u,n])=>`<div class=barrow><span>${esc(u)}</span><div class=bar><i style="width:${n/(top[0]?.[1]||1)*100}%"></i></div><b>${n}</b></div>`).join("")}</div>
 <div class=card><h3>업무 진행</h3><div class=barrow><span>상담기록 학생</span><div class=bar><i style="width:${S.students.length?coun/S.students.length*100:0}%"></i></div><b>${coun}</b></div><div class=barrow><span>결과 입력 원서</span><div class=bar><i style="width:${S.rows.length?result/S.rows.length*100:0}%"></i></div><b>${result}</b></div><p style="color:var(--muted);font-size:12px;margin-top:18px">※ 상담기록은 이 브라우저에만 저장됩니다.</p></div></div>`;
}
function renderStudent(){
 const q=($("#stuSearch")?.value||"").trim(), ban=$("#banFilter")?.value||"";
 const list=S.students.filter(x=>(!ban||x.ban===ban)&&(!q||x.name.includes(q)||x.no===q));
 const bans=[...new Set(S.students.map(x=>x.ban))].sort((a,b)=>+a-+b);
 let detail=`<div class=detail-empty>왼쪽에서 학생을 선택하세요.</div>`;
 if(S.selected){const s=S.students.find(x=>x.key===S.selected);if(s){const ns=notes()[s.key]||[];detail=`<div class=student-head><div><h2>${esc(s.name)}</h2><div class=meta>${s.grade}학년 ${s.ban}반 ${s.no}번 · 지원 ${s.apps.length}건 · 상담 ${ns.length}회</div></div><button class="secondary no-print" onclick="window.print()">상담자료 인쇄</button></div>

function bytesToB64(a){let s="";a.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function b64ToBytes(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveKey(pw,salt){return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:180000,hash:"SHA-256"},await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encryptObj(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));return {v:2,salt:bytesToB64(salt),iv:bytesToB64(iv),ct:bytesToB64(ct)}}
async function decryptObj(pack,pw){const salt=b64ToBytes(pack.salt),iv=b64ToBytes(pack.iv),key=await deriveKey(pw,salt);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,b64ToBytes(pack.ct));return JSON.parse(new TextDecoder().decode(pt))}
function snapshot(){return {rows:S.rows,file:S.file,notes:notes(),changes:S.changes,manualEvents:S.manualEvents,savedAt:new Date().toISOString()}}
function simpleHash(t){let h1=2166136261>>>0,h2=0x9e3779b9>>>0;for(let r=0;r<1200;r++){for(let i=0;i<t.length;i++){h1=Math.imul(h1^t.charCodeAt(i),16777619)>>>0;h2=(Math.imul(h2^h1,2246822519)+i+r)>>>0}}return h1.toString(16).padStart(8,"0")+h2.toString(16).padStart(8,"0")}
async function saveVault(){
 if(!S.rows.length)return alert("먼저 대교협 자료를 불러오세요.");
 const pw=prompt("저장할 비밀번호를 입력하세요. (4자 이상)");if(!pw)return;if(pw.length<4)return alert("비밀번호는 4자 이상으로 설정하세요.");
 const pw2=prompt("비밀번호를 한 번 더 입력하세요.");if(pw!==pw2)return alert("비밀번호가 일치하지 않습니다.");
 try{
   let pack;
   if(window.crypto&&crypto.subtle){pack=await encryptObj(snapshot(),pw);pack.mode="aes";}
   else{pack={v:2,mode:"gate",hash:simpleHash(pw),data:snapshot()};}
   localStorage.setItem(VAULT,JSON.stringify(pack));
   alert("현재 작업을 저장했습니다.\n다음에 이 HTML을 열면 비밀번호로 이어서 사용할 수 있습니다.");
   showSavedGate();
 }catch(e){alert("저장하지 못했습니다: "+e.message)}
}
async function loginVault(){
 const pw=$("#loginPw").value;if(!pw)return;
 try{
   const pack=JSON.parse(localStorage.getItem(VAULT));let d;
   if(pack.mode==="gate"){if(simpleHash(pw)!==pack.hash)throw Error("bad password");d=pack.data;}
   else d=await decryptObj(pack,pw);
   S.rows=d.rows||[];S.file=d.file||"저장된 작업";S.changes=d.changes||[];S.manualEvents=d.manualEvents||[];
   localStorage.setItem(KEY,JSON.stringify({notes:d.notes||{},changes:S.changes,manualEvents:S.manualEvents}));
   buildStudents();openApp();jumpCalendarToData();render();
 }catch(e){alert("비밀번호가 다르거나 저장 데이터가 손상되었습니다.")}
}

function parseScheduleDates(raw){
 const text=String(raw||"").trim(); if(!text)return [];
 const hits=[...text.matchAll(/(20\d{2})[.\-\/\s]*(\d{1,2})[.\-\/\s]*(\d{1,2})/g)]
   .map(m=>({y:+m[1],m:+m[2],d:+m[3]}));
 if(!hits.length)return [];
 const fmt=x=>`${x.y}-${String(x.m).padStart(2,"0")}-${String(x.d).padStart(2,"0")}`;
 if(hits.length<2)return [fmt(hits[0])];
 const a=new Date(hits[0].y,hits[0].m-1,hits[0].d), b=new Date(hits[1].y,hits[1].m-1,hits[1].d);
 if(isNaN(a)||isNaN(b)||b<a)return [fmt(hits[0])];
 const out=[], cur=new Date(a); let guard=0;
 while(cur<=b && guard<31){
   out.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`);
   cur.setDate(cur.getDate()+1); guard++;
 }
 return out;
}

 if(!shown.length)return html+'<p style="color:var(--muted)">앞으로 2주간 등록된 일정이 없습니다.</p></div>';
 const rows=shown.map(e=>{
  const detail=e.row
    ? e.row.ban+'반 '+e.row.no+'번 '+e.row.name+' · '+e.row.university+' · '+e.row.major
    : e.title;
  return '<tr><td><button class="secondary" style="padding:5px 9px" onclick="openScheduleDate(&quot;'+e.date+'&quot;)">'+esc(e.date)+'</button></td>'+
    '<td>'+esc(e.type)+'</td><td>'+esc(detail)+'</td></tr>';
 }).join('');
 html+='<div style="overflow-x:auto"><table><thead><tr><th>날짜</th><th>구분</th><th>학생·대학·내용</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
 if(items.length>shown.length)html+='<p style="font-size:12px;color:var(--muted);margin-top:9px">나머지 '+(items.length-shown.length)+'건은 달력에서 날짜를 선택해 확인할 수 있습니다.</p>';
 return html+'</div>';
}

saveVault=async function(){
 if(!S.rows.length)return alert("먼저 대교협 자료를 불러오세요.");
 let pw=prompt("저장용 PIN 또는 비밀번호를 입력하세요.\n\n권장: 숫자 PIN 4~8자리 (한/영 전환 문제 없음)");

 if(pw.length<4)return alert("4자 이상으로 설정하세요.");

 if(pw!==pw2)return alert("입력값이 일치하지 않습니다.\n숫자 PIN 사용을 권장합니다.");
 try{
   let pack;
   if(window.crypto&&crypto.subtle){pack=await encryptObj(snapshot(),pw);pack.mode="aes";}
   else{pack={v:3,mode:"gate",hash:simpleHash(pw),data:snapshot()};}
   localStorage.setItem(VAULT,JSON.stringify(pack));showSavedGate();
   alert("저장했습니다.\n다음 실행부터 PIN/비밀번호로 이어서 사용할 수 있습니다.");
 }catch(e){alert("저장 실패: "+e.message)}
};

function appStatus(r){

 if(/등록/.test(z))return "등록";

 if(/합격/.test(z)&&!/불합격/.test(z))return "합격";
 if(/불합격/.test(z))return "불합격";
 if(/예비/.test(z))return "예비";

}
function minimumLevel(r){

function deepClone(x){return JSON.parse(JSON.stringify(x))}
function mergeObj(a,b){
  if(!b||typeof b!=="object")return a;
  for(const k of Object.keys(b)){
    if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) mergeObj(a[k],b[k]);
    else a[k]=b[k];
  }
  return a;
}
function getSettings(){
  try{return mergeObj(deepClone(DEFAULT_SETTINGS),JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}"))}
  catch{return deepClone(DEFAULT_SETTINGS)}
}

  const gateTitle=document.querySelector(".brand h1");if(gateTitle)gateTitle.textContent=CFG.appTitle||"진학ON";
  const gateSub=document.querySelector(".brand p");if(gateSub)gateSub.textContent=CFG.appSubtitle||"";
  const dropStrong=document.querySelector("#drop strong");if(dropStrong)dropStrong.textContent=CFG.introTitle||"";
  const dropSpan=document.querySelector("#drop span");if(dropSpan)dropSpan.innerHTML=esc(CFG.introGuide||"").replace(/ → /g," → ");
  const notice=document.querySelector("#gate .notice");if(notice)notice.innerHTML=esc(CFG.privacyText||"");
  document.title=(CFG.appTitle||"진학ON")+" · "+(CFG.appSubtitle||"");
  for(const [view,on] of Object.entries(CFG.menus||{})){
    const b=document.querySelector(`.navbtn[data-view="${view}"]`);
    if(b)b.style.display=on===false?"none":"";

}

// Replace fixed column-name ingest with configured aliases
function configuredGet(a,H,key){
 const names=(CFG.mapping&&CFG.mapping[key])||[];
 for(const n of names){if(H[n]!=null)return String(a[H[n]]??"").trim()}
 return "";
}
async function ingestConfigured(matrix,label){
 let hi=-1,H={};
 for(let i=0;i<Math.min(12,matrix.length);i++){
  const a=matrix[i]||[];
  const expected=["grade","ban","no","name","university","major"];
  const score=expected.filter(k=>((CFG.mapping[k]||[]).some(n=>a.includes(n)))).length;
  if(score>=4){hi=i;H=Object.fromEntries(a.map((x,j)=>[String(x||"").trim(),j]).filter(x=>x[0]));break}
 }
 if(hi<0)throw Error("Excel 헤더를 찾지 못했습니다. 관리자 설정 > Excel 열 매핑에서 열 이름을 확인하세요.");
 const rows=[];
 for(let i=hi+1;i<matrix.length;i++){
  const a=matrix[i]||[];if(!configuredGet(a,H,"name"))continue;
  const r={};for(const k of Object.keys(CFG.mapping))r[k]=configuredGet(a,H,k);r.schoolYear=String(CFG.schoolYear);rows.push(r);
 }
 if(!rows.length)throw Error("지원 자료를 찾지 못했습니다. Excel 열 매핑을 확인하세요.");
 const old=S.rows;S.oldRows=old;S.rows=rows;S.file=label;compare(old,rows);buildStudents();saveSession();openApp();jumpCalendarToData();render();
}

function ensureToastHost(){
  let h=document.querySelector(".toast-host");
  if(!h){h=document.createElement("div");h.className="toast-host";document.body.appendChild(h)}
  return h;
}
function toast(msg,type=""){
  const h=ensureToastHost(),el=document.createElement("div");el.className="toast "+type;el.textContent=msg;h.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateY(8px)";setTimeout(()=>el.remove(),220)},2600);
}
function setSheet(title,html){
  const m=$("#modal"),t=$("#sheetTitle"),b=$("#modalBody");
  if(t)t.textContent=title||"상세 보기";
  if(b)b.innerHTML=html||"";
  m.classList.add("on");m.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
openModal=function(x,title){setSheet(title||"상세 보기",x)}
closeModal=function(){const m=$("#modal");m.classList.remove("on");m.setAttribute("aria-hidden","true");document.body.style.overflow="";};
$("#modal")?.addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal")?.classList.contains("on"))closeModal()});

function sheetInput(title,fields,okLabel="확인"){
  return new Promise(resolve=>{
    const html=`<div class="sheet-form">${fields.map(f=>`<div class=sheet-field><label>${esc(f.label)}</label>${f.type==="textarea"
      ?`<textarea data-f="${esc(f.key)}" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>`
      :f.type==="select"
       ?`<select data-f="${esc(f.key)}">${(f.options||[]).map(o=>`<option ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select>`
       :`<input data-f="${esc(f.key)}" type="${f.type||"text"}" ${f.inputmode?`inputmode="${f.inputmode}"`:""} value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}">`}</div>`).join("")}</div>
      ${fields.some(f=>f.note)?`<div class=sheet-note>${fields.find(f=>f.note).note}</div>`:""}
      <div class=sheet-actions><button class=secondary id=sheetCancel>취소</button><button class=primary id=sheetOk>${esc(okLabel)}</button></div>`;
    setSheet(title,html);
    const done=v=>{closeModal();resolve(v)};
    $("#sheetCancel").onclick=()=>done(null);
    $("#sheetOk").onclick=()=>{
      const out={};document.querySelectorAll("#modalBody [data-f]").forEach(i=>out[i.dataset.f]=i.value);done(out)
    };
    setTimeout(()=>$("#modalBody input,#modalBody textarea,#modalBody select")?.focus(),80);
  })
}
function sheetConfirm(title,message,okLabel="확인",danger=false){
  return new Promise(resolve=>{
    setSheet(title,`<div class=sheet-note style="font-size:14px;color:#536178;padding:15px">${message}</div><div class=sheet-actions><button class=secondary id=sheetNo>취소</button><button class="${danger?"secondary":"primary"}" id=sheetYes style="${danger?"color:#b44f5b!important;border-color:#efcbd0!important":""}">${esc(okLabel)}</button></div>`);
    $("#sheetNo").onclick=()=>{closeModal();resolve(false)};
    $("#sheetYes").onclick=()=>{closeModal();resolve(true)};
  })
}

saveVault=async function(){
  if(!S.rows.length){toast("먼저 대교협 자료를 불러오세요.","warn");return}
  const a=await sheetInput("작업 저장",[
    {key:"pw",label:"PIN 또는 비밀번호",type:"password",inputmode:"numeric",placeholder:"숫자 PIN 4~8자리 권장",note:"한/영 전환 실수를 줄이려면 숫자 PIN 사용을 권장합니다."},
    {key:"pw2",label:"PIN 또는 비밀번호 확인",type:"password",inputmode:"numeric",placeholder:"한 번 더 입력"}
  ],"이 PC에 저장");
  if(!a)return;
  const pw=normPw(a.pw),pw2=normPw(a.pw2);
  if(pw.length<4){toast("4자 이상 입력해 주세요.","warn");return}
  if(pw!==pw2){toast("입력값이 일치하지 않습니다.","bad");return}
  try{
    let pack;
    if(window.crypto&&crypto.subtle){pack=await encryptObj(snapshot(),pw);pack.mode="aes";}
    else{pack={v:6,mode:"gate",hash:simpleHash(pw),data:snapshot()};}
    localStorage.setItem(VAULT,JSON.stringify(pack));showSavedGate();toast("현재 작업을 안전하게 저장했습니다.","good");
  }catch(e){toast("저장하지 못했습니다: "+e.message,"bad")}
};
$("#lockSaveBtn").onclick=saveVault;

addManualEvent=async function(){
  const base=S.selectedDay||new Date().toISOString().slice(0,10);
  const a=await sheetInput("일정 추가",[
    {key:"date",label:"일자",type:"date",value:base},
    {key:"type",label:"구분",type:"select",value:"상담",options:(CFG?.eventTypes||["상담","기타"])},
    {key:"title",label:"일정 내용",type:"textarea",placeholder:"예: 홍길동 학생 학부모 상담"}
  ],"일정 저장");

function inquiryGrade(m,text){
 const a=Number(m.inq1)||0,b=Number(m.inq2)||0;

   if(!a||!b)return 0; return (a+b)/2;
 }
 return a&&b?Math.min(a,b):(a||b);
}
function combMinSum(vals,n,requiredIdx=[]){
 const clean=vals.map((v,i)=>({v:Number(v)||99,i})).filter(x=>x.v<99);
 let best=Infinity;
 function go(pos,pick){
   if(pick.length===n){
     if(requiredIdx.every(i=>pick.some(x=>x.i===i)))best=Math.min(best,pick.reduce((a,x)=>a+x.v,0));
     return;
   }
   for(let j=pos;j<clean.length;j++)go(j+1,[...pick,clean[j]]);
 }
 go(0,[]);return best;
}
function evaluateMinimum(r,m){

 if(!raw||/없음|미적용|해당없음/.test(raw))return {status:"최저 없음",cls:"good",detail:""};
 if(!hasMock(m))return {status:"성적 미입력",cls:"",detail:""};
 const t=raw.replace(/\s+/g,"");
 const kor=Number(m.kor)||0,math=Number(m.math)||0,eng=Number(m.eng)||0,inq=inquiryGrade(m,t),hist=Number(m.hist)||0;
 const vals=[kor,math,eng,inq];
 const complex=/제2외국어|한문.*대체|미적분|기하|확률과통계|과학탐구|사탐|과탐|모집단위|계열|반영방법|가산/.test(t);

 // Korean history independent condition
 const hm=t.match(/한국사(?:영역)?(\d)등급이내/);
 if(hm&&hist&&hist>Number(hm[1]))return {status:"미충족",cls:"bad",detail:`한국사 ${hist}등급`};
 if(hm&&!hist)return {status:"확인 필요",cls:"warn",detail:"한국사 미입력"};

 let n=0,limit=0,required=[];
 let m1=t.match(/상위(\d)개영역(?:등급)?합(?:이)?(\d+)이내/);
 let m2=t.match(/(?:4개|3개)?영역중(?:상위)?(\d)개영역(?:등급)?합(?:이)?(\d+)이내/);
 let mm=m1||m2;
 if(mm){n=Number(mm[1]);limit=Number(mm[2]);}
 else{
   const m3=t.match(/(\d)개영역(?:등급)?합(?:이)?(\d+)이내/);
   if(m3){n=Number(m3[1]);limit=Number(m3[2]);}
 }
 if(/수학(?:영역)?(?:을)?포함|수학필수/.test(t))required.push(1);
 if(/영어(?:영역)?(?:을)?포함|영어필수/.test(t))required.push(2);

 if(n&&limit){
   if(vals.filter(Boolean).length<n)return {status:"성적 미입력",cls:"",detail:"필요 영역 성적 부족"};
   const sum=combMinSum(vals,n,required);
   const pass=sum<=limit;
   if(complex)return {status:"확인 필요",cls:"warn",detail:`기본 등급합 ${sum} / ${limit}`};
   return {status:pass?"충족":"미충족",cls:pass?"good":"bad",detail:`등급합 ${sum} / ${limit}`};
 }
 const one=t.match(/1개영역(?:등급)?(\d+)이내/);
 if(one){
   const lim=Number(one[1]),best=Math.min(...vals.filter(Boolean));
   if(!isFinite(best))return {status:"성적 미입력",cls:"",detail:""};
   if(complex)return {status:"확인 필요",cls:"warn",detail:`최상위 ${best}등급 / ${lim}`};
   return {status:best<=lim?"충족":"미충족",cls:best<=lim?"good":"bad",detail:`최상위 ${best}등급 / ${lim}`};
 }

}

// ---------- tiny PDF text/layout extractor (PDFium text PDFs) ----------
function pdfBytesToLatin1(bytes){
  let out="", step=0x8000;
  for(let i=0;i<bytes.length;i+=step) out+=String.fromCharCode(...bytes.subarray(i,i+step));
  return out;
}
async function pdfInflate(bytes){
  if(!("DecompressionStream" in window)) throw new Error("현재 브라우저가 PDF 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge를 사용해 주세요.");
  const ds=new DecompressionStream("deflate");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
function pdfParseObjects(u8){
  const raw=pdfBytesToLatin1(u8), re=/(\d+)\s+(\d+)\s+obj\b/g, pos=[]; let m;
  while((m=re.exec(raw))) pos.push({id:+m[1],gen:+m[2],start:m.index,bodyStart:re.lastIndex});
  const out=new Map();
  for(let i=0;i<pos.length;i++){
    const a=pos[i], limit=i+1<pos.length?pos[i+1].start:raw.length;
    let end=raw.indexOf("endobj",a.bodyStart); if(end<0||end>limit)end=limit;
    const body=raw.slice(a.bodyStart,end), si=body.indexOf("stream");
    let dict=body,stream=null;
    if(si>=0){
      dict=body.slice(0,si);
      let st=a.bodyStart+si+6;
      if(raw[st]==="\r"&&raw[st+1]==="\n")st+=2; else if(raw[st]==="\r"||raw[st]==="\n")st++;
      let es=raw.indexOf("endstream",st);
      if(es>=0&&es<=end){
        let ee=es; if(raw[ee-1]==="\n")ee--; if(raw[ee-1]==="\r")ee--;
        stream=u8.slice(st,ee);
      }
    }
    out.set(a.id,{id:a.id,dict,stream});
  }
  return out;
}
async function pdfStreamData(obj){
  if(!obj||!obj.stream)return null;
  return /\/FlateDecode/.test(obj.dict)?await pdfInflate(obj.stream):obj.stream;
}
function pdfHexUnicode(hex){
  hex=String(hex).replace(/\s+/g,"");let out="";
  for(let i=0;i+3<hex.length;i+=4)out+=String.fromCharCode(parseInt(hex.slice(i,i+4),16));
  return out;
}
function pdfParseCMap(text){
  const map=new Map();let m;
  const bf=/beginbfchar([\s\S]*?)endbfchar/g;
  while((m=bf.exec(text))){
    for(const q of m[1].matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g))map.set(parseInt(q[1],16),pdfHexUnicode(q[2]));
  }
  const br=/beginbfrange([\s\S]*?)endbfrange/g;
  while((m=br.exec(text))){
    for(const line of m[1].split(/\r?\n/)){
      let q=line.match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/);
      if(q){
        const a=parseInt(q[1],16),b=parseInt(q[2],16),dst=BigInt("0x"+q[3]),len=q[3].length;
        for(let c=a;c<=b;c++)map.set(c,pdfHexUnicode((dst+BigInt(c-a)).toString(16).padStart(len,"0")));
        continue;
      }
      q=line.match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*\[([^\]]+)\]/);
      if(q){
        const a=parseInt(q[1],16), arr=[...q[3].matchAll(/<([0-9A-Fa-f]+)>/g)].map(x=>x[1]);
        arr.forEach((h,i)=>map.set(a+i,pdfHexUnicode(h)));
      }
    }
  }
  return map;
}
function pdfLiteralToken(raw,i){
  let depth=1,out=[];i++;
  for(;i<raw.length&&depth;i++){
    let c=raw.charCodeAt(i)&255;
    if(c===92){
      i++;if(i>=raw.length)break;let d=raw.charCodeAt(i)&255;
      const conv={110:10,114:13,116:9,98:8,102:12};
      if(conv[d]!=null)out.push(conv[d]);
      else if(d===40||d===41||d===92)out.push(d);
      else if(d>=48&&d<=55){
        let oct=String.fromCharCode(d);
        for(let j=0;j<2&&i+1<raw.length;j++){let n=raw.charCodeAt(i+1)&255;if(n>=48&&n<=55){oct+=String.fromCharCode(n);i++}else break}
        out.push(parseInt(oct,8)&255);
      }else if(d===13){if(raw.charCodeAt(i+1)===10)i++}
      else if(d!==10)out.push(d);
      continue;
    }
    if(c===40){depth++;out.push(c)}else if(c===41){depth--;if(depth)out.push(c)}else out.push(c);
  }
  return [{type:"str",v:new Uint8Array(out)},i];
}
function pdfInterpretContent(raw,cmapByName){
  let i=0,ops=[],font="",x=0,y=0,items=[];
  const ws=c=>c===0||c===9||c===10||c===12||c===13||c===32;
  const delim=c=>ws(c)||"()<>[]{}/%".includes(String.fromCharCode(c));
  const decode=bytes=>{
    const cm=cmapByName.get(font)||new Map();let out="";
    for(let j=0;j<bytes.length;j+=2){
      const code=(bytes[j]<<8)|(bytes[j+1]||0);
      out+=cm.get(code)??(code<128?String.fromCharCode(code):"");
    }
    return out;
  };
  while(i<raw.length){
    let c=raw.charCodeAt(i)&255;if(ws(c)){i++;continue}
    if(c===37){while(i<raw.length&&raw[i]!=="\n"&&raw[i]!=="\r")i++;continue}
    let tok=null;
    if(c===47){
      let j=i+1;while(j<raw.length&&!delim(raw.charCodeAt(j)&255))j++;
      tok={type:"name",v:raw.slice(i+1,j)};i=j;
    }else if(c===40){
      [tok,i]=pdfLiteralToken(raw,i);
    }else if(c===60&&raw[i+1]!=="<"){
      let j=raw.indexOf(">",i+1);if(j<0)break;let h=raw.slice(i+1,j).replace(/\s+/g,"");if(h.length%2)h+="0";
      let a=new Uint8Array(h.length/2);for(let k=0;k<a.length;k++)a[k]=parseInt(h.slice(k*2,k*2+2),16);
      tok={type:"str",v:a};i=j+1;
    }else if(c===91||c===93||c===60||c===62){
      i+=((raw[i]==="<"&&raw[i+1]==="<")||(raw[i]===">"&&raw[i+1]===">"))?2:1;continue;
    }else{
      let j=i;while(j<raw.length&&!delim(raw.charCodeAt(j)&255))j++;
      const w=raw.slice(i,j);i=j;
      tok=/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(w)?{type:"num",v:+w}:{type:"op",v:w};
    }
    if(!tok)continue;
    if(tok.type!=="op"){ops.push(tok);continue}
    if(tok.v==="Tf"&&ops.length>=2)font=ops[ops.length-2].v;
    else if(tok.v==="Tm"&&ops.length>=6){x=ops[ops.length-2].v;y=ops[ops.length-1].v}
    else if(tok.v==="Td"&&ops.length>=2){x+=ops[ops.length-2].v;y+=ops[ops.length-1].v}
    else if(tok.v==="Tj"&&ops.length){
      const q=ops[ops.length-1];if(q.type==="str")items.push({x,y,text:decode(q.v),font});
    }
    ops=[];
  }
  return items;
}
async function pdfExtractPages(file){
  const u8=new Uint8Array(await file.arrayBuffer()),objs=pdfParseObjects(u8),fontCmaps=new Map();
  for(const [id,o] of objs){
    const m=o.dict.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
    if(m){const d=await pdfStreamData(objs.get(+m[1]));if(d)fontCmaps.set(id,pdfParseCMap(pdfBytesToLatin1(d)))}
  }
  const pages=[];
  for(const [id,o] of objs){
    if(!/\/Type\s*\/Page\b/.test(o.dict))continue;
    let width=595,height=842, mb=o.dict.match(/\/MediaBox\s*\[\s*[-.\d]+\s+[-.\d]+\s+([.\d]+)\s+([.\d]+)/);
    if(mb){width=+mb[1];height=+mb[2]}
    let fontBlock=o.dict.match(/\/Font\s*<<([\s\S]*?)>>/), fmap=new Map();
    if(fontBlock)for(const q of fontBlock[1].matchAll(/\/([A-Za-z0-9]+)\s+(\d+)\s+\d+\s+R/g))fmap.set(q[1],fontCmaps.get(+q[2])||new Map());
    let refs=[], ma=o.dict.match(/\/Contents\s*\[([^\]]+)\]/);
    if(ma)refs=[...ma[1].matchAll(/(\d+)\s+\d+\s+R/g)].map(x=>+x[1]);
    else{ma=o.dict.match(/\/Contents\s+(\d+)\s+\d+\s+R/);if(ma)refs=[+ma[1]]}
    let items=[];
    for(const rid of refs){const d=await pdfStreamData(objs.get(rid));if(d)items.push(...pdfInterpretContent(pdfBytesToLatin1(d),fmap))}
    pages.push({id,width,height,items});
  }
  pages.sort((a,b)=>a.id-b.id);return pages;
}
function pdfLines(items){
  const arr=[...items].sort((a,b)=>Math.abs(b.y-a.y)>.8?b.y-a.y:a.x-b.x),out=[];
  for(const it of arr){
    let line=out.find(l=>Math.abs(l.y-it.y)<.8);
    if(!line){line={y:it.y,items:[]};out.push(line)}
    line.items.push(it);
  }
  out.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.text=l.items.map(x=>x.text||" ").join("");l.compact=l.text.replace(/\s+/g,"")});
  return out.sort((a,b)=>b.y-a.y);
}

const SUBJECTS=[
 "화법과작문","언어와매체","확률과통계","미적분","기하",
 "생활과윤리","윤리와사상","한국지리","세계지리","동아시아사","세계사","경제","정치와법","사회문화",
 "물리학I","물리학II","화학I","화학II","생명과학I","생명과학II","지구과학I","지구과학II"
];
function normSubjectText(x){return String(x||"").replace(/[·\s]/g,"").replace(/Ⅰ/g,"I").replace(/Ⅱ/g,"II")}
function subjectsFromText(text){
  const n=normSubjectText(text),hits=SUBJECTS.filter(x=>n.includes(normSubjectText(x)));
  return {
    kor:hits.find(x=>x==="화법과작문"||x==="언어와매체")||"",
    math:hits.find(x=>["확률과통계","미적분","기하"].includes(x))||"",
    inquiry:hits.filter(x=>!["화법과작문","언어와매체","확률과통계","미적분","기하"].includes(x)).slice(0,2)
  };
}
function findStudentForPdf(name,no,ban){
  let c=S.students.filter(st=>st.name===name);
  if(ban)c=c.filter(st=>String(st.ban)===String(ban));
  if(no)c=c.filter(st=>Number(st.no)===Number(no));
  if(c.length===1)return c[0];

    if(no&&c.length>1){const d=c.filter(st=>Number(st.no)===Number(no));if(d.length===1)return d[0]}
  }

}
function parseEvaluationPdf(pages,exam){
  const records=[];let pendingSubjects={kor:"",math:"",inquiry:[]},currentExamNo="",currentName="";
  const studentNames=S.students.map(x=>x.name).sort((a,b)=>b.length-a.length);
  for(const page of pages){
    for(const line of pdfLines(page.items)){
      const t=line.compact;
      if(t.includes("선택과목"))pendingSubjects=subjectsFromText(line.text);
      if(/^\d{8,12}$/.test(t)){currentExamNo=t;currentName="";continue}
      const hit=studentNames.find(n=>t.includes(n));
      if(hit)currentName=hit;
      if(t.includes("등급")&&currentName){
        const nums=line.items.filter(x=>/^[1-9]$/.test(x.text)&&x.x>page.width*.20).sort((a,b)=>a.x-b.x).map(x=>Number(x.text));
        if(nums.length>=6){
          let ban="",no="";
          const candidates=S.students.filter(st=>st.name===currentName);
          if(candidates.length===1){ban=candidates[0].ban;no=candidates[0].no}
          else if(currentExamNo){
            for(const st of candidates){
              const suffix=String(st.ban)+String(st.no).padStart(2,"0");
              if(currentExamNo.endsWith(suffix)){ban=st.ban;no=st.no;break}
            }
          }
          records.push({name:currentName,ban,no,examNo:currentExamNo,hist:nums[0],kor:nums[1],math:nums[2],eng:nums[3],inq1:nums[4],inq2:nums[5],
            korSel:pendingSubjects.kor,mathSel:pendingSubjects.math,inqSel1:pendingSubjects.inquiry[0]||"",inqSel2:pendingSubjects.inquiry[1]||""});
          currentName="";currentExamNo="";
        }
      }
    }
  }
  return records;
}
function closestSingleDigit(items,target,tol){
  const a=items.filter(x=>/^[1-9]$/.test(x.text)&&Math.abs(x.x-target)<=tol).sort((x,y)=>Math.abs(x.x-target)-Math.abs(y.x-target));
  return a.length?Number(a[0].text):0;
}
function parseNationalPdf(pages,exam){
  const records=[],studentNames=S.students.map(x=>x.name).sort((a,b)=>b.length-a.length);
  for(const page of pages){
    const w=page.width,tol=w*.022;
    for(const line of pdfLines(page.items)){
      const name=studentNames.find(n=>line.compact.includes(n));if(!name)continue;
      const noMatch=line.compact.match(/^(\d{1,2})/),no=noMatch?Number(noMatch[1]):"";
      const sub=subjectsFromText(line.text);
      const grades={
        kor:closestSingleDigit(line.items,w*.2811,tol),
        math:closestSingleDigit(line.items,w*.4636,tol),
        eng:closestSingleDigit(line.items,w*.4929,tol),
        hist:closestSingleDigit(line.items,w*.5236,tol),
        inq1:closestSingleDigit(line.items,w*.7363,tol),
        inq2:closestSingleDigit(line.items,w*.9481,tol)
      };
      if(Object.values(grades).filter(Boolean).length>=5){
        const st=findStudentForPdf(name,no,"");
        records.push({name,ban:st?.ban||"",no:st?.no||no,...grades,korSel:sub.kor,mathSel:sub.math,inqSel1:sub.inquiry[0]||"",inqSel2:sub.inquiry[1]||""});
      }
    }
  }
  return records;
}
async function parseScorePdf(file){

  let records=exam.kind.includes("전국연합")?parseNationalPdf(pages,exam):parseEvaluationPdf(pages,exam);
  if(!records.length)throw new Error("학생 성적 행을 찾지 못했습니다. 스캔 PDF가 아닌 성적일람표 원본 PDF인지 확인해 주세요.");
  return {file:file.name,exam,records};
}
// ===== 학급별 평가원/전국연합 성적일람표 양식 호환 =====
// 표의 등급 열 위치와 학급 번호를 원본 PDF에서 읽으며, 수능최저 판정 규칙은 변경하지 않는다.
function reportClassNumber(page,fileName){
 const ls=pdfLines(page.items),top=ls.slice(0,9).map(l=>l.compact).join('');
 let m=top.match(/(?:^|[^0-9])(\d{1,2})반(?:[^가-힣]|$)/);if(m)return Number(m[1]);
 const k=ls.findIndex(l=>l.compact.includes('학년반학교명'));
 if(k>=0){
  const hx=ls[k].items.find(z=>z.text==='반')?.x;
  if(hx!=null)for(const l of ls.slice(k+1,k+5)){
   const v=l.items.find(z=>/^\d{1,2}$/.test(z.text)&&Math.abs(z.x-hx)<9);
   if(v)return Number(v.text);
  }
 }
 m=String(fileName||'').match(/(?:^|[^0-9])(\d{1,2})\s*반/);
 return m?Number(m[1]):0;
}
function reportGradeColumns(page){
 let best=[];
 for(const l of pdfLines(page.items)){
  const a=[],xs=l.items;
  for(let i=0;i<xs.length;i++){
   const t=String(xs[i].text||'').replace(/\s/g,'');
   if(t==='등급'){a.push(xs[i].x);continue}
   if(t!=='등')continue;
   const next=xs.slice(i+1,i+5).find(z=>z.text==='급'&&z.x>xs[i].x&&z.x-xs[i].x<24);
   if(next)a.push((xs[i].x+next.x)/2);
  }
  if(a.length>best.length)best=a;
 }
 return best.length>=6?best.slice(0,7):[];
}
const _legacyNationalPdf=parseNationalPdf;
parseNationalPdf=function(pages,exam,fileName=''){
 const out=[],names=[...new Set(S.students.map(s=>s.name))].sort((a,b)=>b.length-a.length);
 for(const p of pages){
  const cols=reportGradeColumns(p);
  if(cols.length<6){out.push(..._legacyNationalPdf([p],exam));continue}
  const ban=reportClassNumber(p,fileName),tol=Math.max(7,p.width*.012);
  for(const l of pdfLines(p.items)){
   const name=names.find(n=>l.compact.includes(n));if(!name)continue;
   const x=l.items.find(z=>z.text===name[0])?.x;
   const id=l.items.filter(z=>/^\d$/.test(z.text)&&x!=null&&z.x<x-4).map(z=>z.text).join('');
   const no=Number(id)||Number(l.compact.match(/^(\d{1,2})/)?.[1])||0;
   const vals=cols.map(cx=>{
    const hits=l.items.filter(z=>/^[1-9]$/.test(z.text)&&Math.abs(z.x-cx)<tol)
      .sort((a,b)=>Math.abs(a.x-cx)-Math.abs(b.x-cx));
    return hits.length?Number(hits[0].text):0;
   });
   if(vals.slice(0,6).filter(Boolean).length<5)continue;
   const sub=subjectsFromText(l.text);
   out.push({name,ban,no,kor:vals[0],math:vals[1],eng:vals[2],hist:vals[3],inq1:vals[4],inq2:vals[5],
    korSel:sub.kor,mathSel:sub.math,inqSel1:sub.inquiry[0]||'',inqSel2:sub.inquiry[1]||''});
  }
 }
 return out;
};
// PDF 텍스트에 과목명이 여러 번 나타날 때 원문 왼쪽에서 오른쪽 순서대로 선택한다.
subjectsFromText=function(text){
 const n=normSubjectText(text),hits=[],occupied=[];
 for(const s of [...SUBJECTS].sort((a,b)=>normSubjectText(b).length-normSubjectText(a).length)){
  const t=normSubjectText(s);let at=n.indexOf(t);
  while(at>=0){
   if(!occupied.some(r=>at<r[1]&&at+t.length>r[0])){
    occupied.push([at,at+t.length]);hits.push({s,at});
   }
   at=n.indexOf(t,at+1);
  }
 }
 hits.sort((a,b)=>a.at-b.at);
 const a=hits.map(z=>z.s);
 return {kor:a.find(x=>x==='화법과작문'||x==='언어와매체')||'',
  math:a.find(x=>x==='확률과통계'||x==='미적분'||x==='기하')||'',
  inquiry:a.filter(x=>!['화법과작문','언어와매체','확률과통계','미적분','기하'].includes(x)).slice(0,2)};
};
// 같은 이름이 여러 반에 있어도 임의로 다른 학생에 연결하지 않는다.
findStudentForPdf=function(name,no,ban){
 let a=S.students.filter(st=>st.name===name);
 if(ban)a=a.filter(st=>Number(st.ban)===Number(ban));
 if(no)a=a.filter(st=>Number(st.no)===Number(no));
 return a.length===1?a[0]:null;
};
parseScorePdf=async function(file){
 const pages=await pdfExtractPages(file),exam=detectPdfExam(pages,file.name);
 const national=parseNationalPdf(pages,exam,file.name);
 const evaluation=parseEvaluationPdf(pages,exam);
 const records=national.length>evaluation.length?national:evaluation;

 return {file:file.name,exam,records};
};

const _evaluateMinimumV8=evaluateMinimum;
evaluateMinimum=function(r,m){
  const base=_evaluateMinimumV8(r,m), raw=String(r.minimum||"").replace(/\s+/g,"");
  if(!hasMock(m)||base.status==="최저 없음")return base;

  // Explicit math selection restrictions.
  const requiresCalc=/미적분|기하/.test(raw)&&(/수학|선택과목/.test(raw));
  if(requiresCalc&&m.mathSel&& !["미적분","기하"].includes(m.mathSel)){
    return {status:"미충족",cls:"bad",detail:`수학 선택과목 ${m.mathSel}`};
  }
  // Explicit science inquiry restriction: if both known and neither science, flag.
  if(/과학탐구|과탐/.test(raw)&&m.inqSel1&&m.inqSel2){
    const sci=x=>/물리학|화학|생명과학|지구과학/.test(x);
    if(!sci(m.inqSel1)||!sci(m.inqSel2))return {status:"미충족",cls:"bad",detail:`탐구 ${m.inqSel1}/${m.inqSel2}`};
  }
  return base;
};

function dashIssueSummary(st){
  const chips=[];
  const pending=st.apps.filter(r=>!hasResult(r)).length;
  if(pending)chips.push({text:`결과 ${pending}건 미입력`,cls:"warn"});
  let fail=0,check=0,empty=0;
  for(const r of st.apps){
    if(!r.minimum)continue;
    const sm=selectedMock?selectedMock(st.key):latestMock(st.key);
    const ev=evaluateMinimum(r,sm.data||{});
    if(ev.status==="미충족")fail++;
    else if(ev.status==="확인 필요")check++;
    else if(ev.status==="성적 미입력")empty++;
  }
  if(fail)chips.push({text:`최저 미충족 ${fail}건`,cls:"bad"});
  if(check)chips.push({text:`최저 확인 ${check}건`,cls:"warn"});
  if(empty)chips.push({text:`모평 미입력 ${empty}건`,cls:""});
  return chips;
}

// =========================================================
// 진학ON v9 — 수능최저 다중조건 규칙 엔진
// 대교협 자연어 원문 → 구조화 규칙 → 모평 성적 자동 판정
// =========================================================
function minCleanText(raw){
  return String(raw||"").normalize("NFKC")
    .replace(/\r/g,"\n").replace(/\n+/g,"\n")
    .replace(/[ㆍ·]/g,"·").trim();
}
function minCompact(raw){
  return minCleanText(raw)
    .replace(/국,\s*수,\s*영,\s*탐/g,"국어,수학,영어,탐구")
    .replace(/국,\s*수,\s*영/g,"국어,수학,영어")
    .replace(/탐\(/g,"탐구(")
    .replace(/사\/과탐/g,"사회\/과학탐구")
    .replace(/\s+/g,"");
}
function minIsScience(subj){
  return /물리학|화학|생명과학|지구과학/.test(String(subj||""));
}
function minHistoryLimit(text){
  const t=minCompact(text);
  const m=t.match(/한국사(?:영역)?[^0-9]{0,8}([1-9])등급(?:이내)?/);
  return m?Number(m[1]):null;
}
function minDomains(text){
  let t=minCompact(text);
  // Only inspect the requirement sentence before long footnotes.
  t=t.split("※")[0];
  const out=[];
  if(/국어/.test(t))out.push("kor");
  if(/수학/.test(t))out.push("math");
  if(/영어/.test(t))out.push("eng");
  if(/탐구|사탐|과탐|사회\/과학/.test(t))out.push("inq");
  return out.length?out:["kor","math","eng","inq"];
}
function minInquiryPolicy(text){
  const t=minCompact(text);
  const p={
    mode:"unknown",requireTwo:false,scienceRequired:0,
    scienceBonus:false,secondForeign:false
  };
  if(/제2외국어.*(?:탐구.*대체|대체가능)|한문.*(?:탐구.*대체|대체가능)/.test(t))p.secondForeign=true;
  if(/과학탐구\(1과목이상\)필수응시|과탐\(1과목이상\)필수응시/.test(t))p.scienceRequired=1;
  if(/탐구영역은반드시2과목.*응시|탐구.*반드시2과목.*응시|2과목을응시하여야/.test(t))p.requireTwo=true;

  if(/과탐1과목이상응시자의경우.*탐구2과목평균.*과탐상위1개과목.*우수한등급/.test(t)){
    p.mode="bestSciOrAvg2";p.requireTwo=true;p.scienceBonus=true;
  }else if(/2개과목.*등급평균.*소수점이하절사|2과목.*등급평균.*소수점이하절사/.test(t)){
    p.mode="avg2floor";p.requireTwo=true;
  }else if(/탐구\(2개과목평균\)|탐구\(2과목평균\)|2개과목.*평균등급|2과목.*평균등급|2개과목의등급평균|2과목의등급평균/.test(t)){
    p.mode="avg2";p.requireTwo=true;
  }else if(/탐구\(1개?과목\)|탐구\(사회혹은과학탐구1과목\)|상위1과목반영|최상위1과목.*반영|2과목중상위1과목/.test(t)){
    p.mode="best1";
  }
  return p;
}
function minMainRule(text){
  const t=minCompact(text);
  const domains=minDomains(t);
  let m=t.match(/상위1개(?:영역)?등급과수학(?:영역)?등급합(?:이)?(\d+)(?:등급)?(?:이내)?/);
  if(m)return {type:"fixedMathPlusBest",limit:Number(m[1]),domains,required:["math"]};

  // 2개 영역 등급 합 5 / 3개 영역 등급의 합이 7 / 상위 2개 영역의 합이 9 ...
  m=t.match(/(?:상위)?(\d+)개(?:영역)?(?:등급)?(?:의)?합(?:이)?(\d+)(?:등급)?(?:이내)?/);
  if(m){
    const required=[];
    if(/수학(?:영역)?포함/.test(t))required.push("math");
    if(/영어(?:영역)?포함/.test(t))required.push("eng");
    return {type:"sum",choose:Number(m[1]),limit:Number(m[2]),domains,required};
  }

  // 1개 영역 이상이 5등급 이내 / 1개 영역 3등급 이내
  m=t.match(/(?:상위)?1개(?:영역)?(?:등급)?(?:이상)?(?:이)?([1-9])(?:등급)?(?:이내)?/);
  if(m)return {type:"anyMax",choose:1,limit:Number(m[1]),domains,required:[]};

  return {type:"unknown",domains,required:[]};
}
function minBranchRules(raw,row){
  const text=minCleanText(raw);
  const globalNotes=(text.match(/※[\s\S]*$/)||[""])[0];
  const re=/【([^】]+)】\s*[:：]\s*([\s\S]*?)(?=【|※|$)/g;
  const found=[];let m;
  while((m=re.exec(text)))found.push({label:m[1],body:m[2]+"\n"+globalNotes});
  if(!found.length)found.push({label:"",body:text});

  const tr=String(row?.track||"");
  let use=found;
  if(tr){
    const hit=found.filter(x=>
      (/인문/.test(tr)&&/인문/.test(x.label))||
      (/자연/.test(tr)&&/자연/.test(x.label))||
      (/예체능/.test(tr)&&/예체능/.test(x.label))
    );
    if(hit.length)use=hit;
  }
  return use.map(x=>{
    const inquiry=minInquiryPolicy(x.body);
    return {
      label:x.label,
      raw:x.body,
      main:minMainRule(x.body),
      historyMax:minHistoryLimit(x.body),
      inquiry,
      english12As1:/영어영역1,2등급을통합하여1등급|영어1,2등급을통합하여1등급/.test(minCompact(x.body))
    };
  });
}
function minInquiryScenarios(policy,m){
  const a=Number(m.inq1)||0,b=Number(m.inq2)||0,l2=Number(m.lang2)||0;
  const s1=String(m.inqSel1||""),s2=String(m.inqSel2||"");
  if(policy.requireTwo&&(!a||!b))return {missing:true,scenarios:[]};
  if(!a&&!b)return {missing:true,scenarios:[]};

  const av=(x,y)=>(x+y)/2;
  const avgCandidates=[];
  if(a&&b)avgCandidates.push({v:av(a,b),desc:`탐${av(a,b)}(${a}·${b} 평균)`});
  if(policy.secondForeign&&l2){
    if(a)avgCandidates.push({v:av(a,l2),desc:`탐${av(a,l2)}(${a}·제2외${l2} 평균)`});
    if(b)avgCandidates.push({v:av(b,l2),desc:`탐${av(b,l2)}(${b}·제2외${l2} 평균)`});
  }

  let scenarios=[];
  if(policy.mode==="best1"){
    let candidates=[];
    if(a)candidates.push({v:a,desc:`탐${a}`});
    if(b)candidates.push({v:b,desc:`탐${b}`});
    if(policy.secondForeign&&l2)candidates.push({v:l2,desc:`제2외${l2}`});
    candidates.sort((x,y)=>x.v-y.v);
    scenarios=candidates.length?[candidates[0]]:[];
  }else if(policy.mode==="avg2"){
    if(avgCandidates.length)scenarios=[avgCandidates.sort((x,y)=>x.v-y.v)[0]];
  }else if(policy.mode==="avg2floor"){
    if(avgCandidates.length){
      const q=avgCandidates.sort((x,y)=>x.v-y.v)[0];
      scenarios=[{v:Math.floor(q.v),desc:`${q.desc}→${Math.floor(q.v)}(절사)`}];
    }
  }else if(policy.mode==="bestSciOrAvg2"){
    if(avgCandidates.length){
      const avg=avgCandidates.sort((x,y)=>x.v-y.v)[0];
      const sci=[];
      if(a&&minIsScience(s1))sci.push({v:a,desc:`과탐${a}`});
      if(b&&minIsScience(s2))sci.push({v:b,desc:`과탐${b}`});
      sci.sort((x,y)=>x.v-y.v);
      const best=sci.length&&sci[0].v<avg.v?sci[0]:avg;
      scenarios=[{v:best.v,desc:best===avg?avg.desc:`${best.desc}(평균 ${avg.v}보다 우수)`}];
    }
  }else{
    // Unknown inquiry policy: evaluate plausible "best one" and "two-subject average".
    const poss=[];
    if(a||b){
      const best=Math.min(...[a,b].filter(Boolean));
      poss.push({v:best,desc:`탐${best}(상위1)`});
    }
    if(a&&b)poss.push({v:(a+b)/2,desc:`탐${(a+b)/2}(${a}·${b} 평균)`});
    const seen=new Set();scenarios=poss.filter(x=>{const k=String(x.v);if(seen.has(k))return false;seen.add(k);return true});
  }
  return {missing:!scenarios.length,scenarios};
}
function minCombos(items,n,required=[]){
  const out=[];
  function go(pos,pick){
    if(pick.length===n){
      if(required.every(r=>pick.some(x=>x.code===r)))out.push(pick);
      return;
    }
    for(let i=pos;i<items.length;i++)go(i+1,[...pick,items[i]]);
  }
  go(0,[]);
  return out;
}
function minEvalScenario(rule,m,inq){
  const kor=Number(m.kor)||0,math=Number(m.math)||0;
  let eng=Number(m.eng)||0;
  const hist=Number(m.hist)||0;
  const engOriginal=eng;
  if(rule.english12As1&&eng&&eng<=2)eng=1;

  if(rule.historyMax!=null){
    if(!hist)return {status:"성적 미입력",detail:"한국사 등급 미입력"};
    if(hist>rule.historyMax)return {status:"미충족",detail:`한국사 ${hist} > ${rule.historyMax}`};
  }
  if(rule.inquiry.scienceRequired){
    if(!m.inqSel1&&!m.inqSel2)return {status:"판정 보류",detail:"과탐 필수 여부 확인 필요"};
    const cnt=[m.inqSel1,m.inqSel2].filter(minIsScience).length;
    if(cnt<rule.inquiry.scienceRequired)return {status:"미충족",detail:`과탐 ${rule.inquiry.scienceRequired}과목 이상 필수`};
  }

  const map={
    kor:{code:"kor",v:kor,label:`국${kor||"-"}`},
    math:{code:"math",v:math,label:`수${math||"-"}`},
    eng:{code:"eng",v:eng,label:rule.english12As1&&engOriginal===2?"영2→1":`영${eng||"-"}`},
    inq:{code:"inq",v:inq?.v||0,label:inq?.desc||"탐-"}
  };
  const allowed=rule.main.domains.map(k=>map[k]).filter(Boolean);
  const present=allowed.filter(x=>x.v>0);
  const required=rule.main.required||[];

  if(required.some(k=>!map[k]||!map[k].v))return {status:"성적 미입력",detail:"필수 영역 성적 미입력"};

  if(rule.main.type==="unknown")return {status:"판정 보류",detail:"최저 문장 구조 자동 해석 불가"};

  if(rule.main.type==="fixedMathPlusBest"){
    if(!math)return {status:"성적 미입력",detail:"수학 성적 미입력"};
    const other=present.filter(x=>x.code!=="math").sort((a,b)=>a.v-b.v)[0];
    if(!other)return {status:"성적 미입력",detail:"비교 영역 성적 미입력"};
    const sum=math+other.v;
    return {status:sum<=rule.main.limit?"충족":"미충족",detail:`수${math} + ${other.label} = ${sum} / ${rule.main.limit}`};
  }

  if(rule.main.type==="anyMax"){
    if(!present.length)return {status:"성적 미입력",detail:"영역 성적 미입력"};
    const best=[...present].sort((a,b)=>a.v-b.v)[0];
    return {status:best.v<=rule.main.limit?"충족":"미충족",detail:`${best.label} / ${rule.main.limit}등급 이내`};
  }

  if(rule.main.type==="sum"){
    if(present.length<rule.main.choose){
      return {status:"성적 미입력",detail:`${rule.main.choose}개 영역 필요`};
    }
    const combos=minCombos(present,rule.main.choose,required);
    if(!combos.length)return {status:"성적 미입력",detail:"필수 포함 조건 계산 불가"};
    const best=combos.map(c=>({c,sum:c.reduce((a,x)=>a+x.v,0)})).sort((a,b)=>a.sum-b.sum)[0];
    const tail=rule.historyMax!=null?` / 한${hist}≤${rule.historyMax}`:"";
    return {status:best.sum<=rule.main.limit?"충족":"미충족",detail:`${best.c.map(x=>x.label).join(" + ")} = ${best.sum} (기준 ${rule.main.limit})${tail}`};
  }
  return {status:"판정 보류",detail:"자동 계산 규칙 없음"};
}
function minAggregateResults(results,context=""){
  if(!results.length)return {status:"판정 보류",cls:"warn",detail:context||"판정 자료 없음"};
  const sts=[...new Set(results.map(x=>x.status))];
  if(sts.length===1){
    const s=sts[0], cls=s==="충족"?"good":s==="미충족"?"bad":s==="판정 보류"?"warn":"";
    const details=[...new Set(results.map(x=>x.detail).filter(Boolean))];
    return {status:s,cls,detail:(context?context+" · ":"")+details.slice(0,2).join(" / ")};
  }
  if(sts.every(x=>x==="성적 미입력"||x==="판정 보류")){
    return {status:sts.includes("성적 미입력")?"성적 미입력":"판정 보류",cls:sts.includes("판정 보류")?"warn":"",detail:context||"추가 정보 필요"};
  }
  return {status:"판정 보류",cls:"warn",detail:(context?context+" · ":"")+"조건별 결과가 달라 원문 확인 필요"};
}
evaluateMinimum=function(r,m){
  const raw=String(r.minimum||"").trim();
  if(!raw||/^\s*$/.test(raw)||/최저\s*(없음|미적용)|해당없음/.test(raw))return {status:"최저 없음",cls:"good",detail:""};
  if(!hasMock(m))return {status:"성적 미입력",cls:"",detail:""};

  const branches=minBranchRules(raw,r);
  const branchResults=[];
  for(const rule of branches){
    const iq=minInquiryScenarios(rule.inquiry,m);
    // If inquiry is not one of the allowed domains, missing inquiry does not block calculation.
    const needsInquiry=rule.main.domains.includes("inq");
    if(needsInquiry&&iq.missing){
      branchResults.push({status:"성적 미입력",detail:"탐구 성적 미입력"});
      continue;
    }
    const scenarios=needsInquiry?iq.scenarios:[{v:0,desc:""}];
    const rr=scenarios.map(q=>minEvalScenario(rule,m,q));
    branchResults.push(minAggregateResults(rr,rule.label||""));
  }
  return minAggregateResults(branchResults,branches.length>1&&!String(r.track||"")?"계열별 기준 자동 비교":"");
};

// Human-friendly rule summary shown as a tooltip/small caption.
function minRuleSummary(raw,row){
  const rules=minBranchRules(raw,row);
  const one=rules[0];
  if(!one||one.main.type==="unknown")return "복합 조건";
  const main=one.main;
  let x="";
  if(main.type==="sum")x=`${main.choose}개 합 ≤ ${main.limit}`;
  else if(main.type==="anyMax")x=`1개 영역 ≤ ${main.limit}`;
  else if(main.type==="fixedMathPlusBest")x=`수학 + 최상위1 ≤ ${main.limit}`;
  if(main.required.includes("math"))x+=" · 수학 포함";
  if(one.inquiry.mode==="best1")x+=" · 탐구 상위1";
  if(one.inquiry.mode==="avg2")x+=" · 탐구 2과목 평균";
  if(one.inquiry.mode==="avg2floor")x+=" · 탐구 평균 절사";
  if(one.inquiry.mode==="bestSciOrAvg2")x+=" · 탐구 우수값";
  if(one.inquiry.scienceRequired)x+=" · 과탐 필수";
  if(one.historyMax!=null)x+=` · 한≤${one.historyMax}`;
  if(one.english12As1)x+=" · 영1·2→1";
  return x||"복합 조건";
}

// PDF 6/9월 parser: capture second foreign language grade too when present.
const _parseEvaluationPdfV9=parseEvaluationPdf;
parseEvaluationPdf=function(pages,exam){
  const records=_parseEvaluationPdfV9(pages,exam);
  // Re-scan grade lines only to supplement a 7th single-digit grade when it exists.
  const byName=new Map(records.map(r=>[r.name,r]));
  let currentName="";
  const studentNames=S.students.map(x=>x.name).sort((a,b)=>b.length-a.length);
  for(const page of pages){
    for(const line of pdfLines(page.items)){
      const hit=studentNames.find(n=>line.compact.includes(n));if(hit)currentName=hit;
      if(line.compact.includes("등급")&&currentName&&byName.has(currentName)){
        const nums=line.items.filter(x=>/^[1-9]$/.test(x.text)&&x.x>page.width*.20).sort((a,b)=>a.x-b.x).map(x=>Number(x.text));
        if(nums.length>=7)byName.get(currentName).lang2=nums[6];
        currentName="";
      }
    }
  }
  return records;
};

function mergeDeepMocks(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));

}

function persistMocksToLibrary(mocks,meta){
  const lib=readScoreLibrary();
  lib.mocks=mergeDeepMocks(lib.mocks,mocks||{});
  if(meta&&meta.exam){
    const old=lib.imports[meta.exam]||{};

// PDF 저장 함수: 작업 저장소 + 독립 성적 라이브러리에 동시에 보관.
// 학급별 명렬의 번호가 다를 경우 동일 학급·이름 한 명만 보수적으로 연결.
function matchPdfStudentForSave(rec){
  const norm=x=>String(x||"").normalize("NFC").replace(/\s+/g,"");
  const matches=S.students.filter(st=>norm(st.name)===norm(rec.name));
  if(!matches.length)return {student:null,reason:"대교협 학생 목록에 이름 없음"};
  const ban=Number(rec.ban)||0,no=Number(rec.no)||0;
  const inClass=ban?matches.filter(st=>Number(st.ban)===ban):matches;
  if(!inClass.length)return {student:null,reason:"대교협 학생 목록과 학급 불일치"};
  if(ban){
    const exact=no?inClass.filter(st=>Number(st.no)===no):[];
    if(exact.length===1)return {student:exact[0],reason:""};
    if(inClass.length===1){
      const st=inClass[0],reason=no&&Number(st.no)!==no?"PDF "+no+"번 → 대교협 "+st.no+"번 (동일 반·이름)":"";
      return {student:st,reason};
    }
    return {student:null,reason:"동명이인 또는 번호 중복으로 연결 보류"};
  }
  if(matches.length===1){
    const st=matches[0],reason=no&&Number(st.no)!==no?"PDF "+no+"번 → 대교협 "+st.no+"번 (이름 유일)":"";
    return {student:st,reason};
  }
  return {student:null,reason:"학급 정보가 없어 동명이인을 구분할 수 없음"};
}
// 실제 저장 후 읽어 확인하고, 저장에 실패한 경우 성공으로 표시하지 않는다.
savePdfScoreResult=function(parsed){
  const exam=String((parsed.exam||{}).label||"").trim();
  if(!/^(?:[1-9]|1[0-2])월$/.test(exam))
    throw new Error("시험 월을 확인하지 못했습니다. PDF의 시행 월을 확인해 주세요.");
  const newMocks={},unmatched=[],warnings=[],used=new Set();
  for(const r of parsed.records){
    const matched=matchPdfStudentForSave(r),st=matched.student;
    const source=(r.ban?r.ban+"반 ":"")+(r.no?r.no+"번 ":"")+r.name;
    if(!st){unmatched.push(source+" ("+matched.reason+")");continue}
    if(used.has(st.key)){unmatched.push(source+" (동일 학생 중복행)");continue}
    const grades=["kor","math","eng","hist","inq1","inq2"];
    const data={
      kor:Number(r.kor)||0,math:Number(r.math)||0,eng:Number(r.eng)||0,
      inq1:Number(r.inq1)||0,inq2:Number(r.inq2)||0,hist:Number(r.hist)||0,
      foreign:r.foreign||"",
      korSel:r.korSel||"",mathSel:r.mathSel||"",inqSel1:r.inqSel1||"",inqSel2:r.inqSel2||"",
      source:"PDF",sourceFile:parsed.file,kind:parsed.exam.kind,importedAt:new Date().toISOString()
    };
    if(grades.some(k=>!Number.isInteger(data[k])||data[k]<0||data[k]>9)||grades.filter(k=>data[k]>=1).length<5){
      unmatched.push(source+" (등급 누락 또는 범위 오류)");continue;
    }
    used.add(st.key);newMocks[st.key]={[exam]:data};
    if(matched.reason)warnings.push(source+": "+matched.reason);
  }
  const total=parsed.records.length,matched=used.size;
  if(!matched)throw new Error("PDF "+total+"명은 읽었으나 저장된 학생이 0명입니다. 반·번호·이름을 확인해 주세요. "+unmatched.slice(0,4).join("; "));
  const libKey=scoreLibraryKey(),oldLib=localStorage.getItem(libKey),oldLocal=localStorage.getItem(KEY);
  const lib=readScoreLibrary(),local=getLocalState();
  lib.mocks=mergeDeepMocks(lib.mocks,newMocks);lib.imports=lib.imports||{};
  const prev=lib.imports[exam]||{};
  const count=Object.values(lib.mocks).filter(x=>x&&x[exam]&&["kor","math","eng","inq1","inq2","hist"].some(k=>x[exam][k])).length;
  lib.imports[exam]={
    ...prev,label:exam,kind:parsed.exam.kind||prev.kind||"",
    updatedAt:new Date().toISOString(),count,
    files:[...new Set([...(prev.files||[]),parsed.file])]
  };
  local.mocks=mergeDeepMocks(local.mocks,newMocks);
  const restore=(key,value)=>{
    try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch(_){}
  };
  try{
    localStorage.setItem(libKey,JSON.stringify(lib));
    localStorage.setItem(KEY,JSON.stringify(local));
    const stored=getMockStore(),library=readScoreLibrary().mocks;
    for(const [key,exams] of Object.entries(newMocks)){
      const expected=exams[exam],actual=(stored[key]||{})[exam],disk=(library[key]||{})[exam];
      if(!actual||!disk||["kor","math","eng","hist","inq1","inq2"].some(f=>actual[f]!==expected[f]||disk[f]!==expected[f]))
        throw new Error("저장 후 재조회 결과가 일치하지 않습니다.");
    }
  }catch(e){
    restore(libKey,oldLib);restore(KEY,oldLocal);
    throw new Error("성적 저장 실패: "+(e.message||e)+". 브라우저 저장 공간 및 설정을 확인해 주세요.");
  }
  return {matched,verified:matched,unmatched,warnings,total};
};

function scoreLibrarySummary(){
  const lib=readScoreLibrary(),counts={};
  for(const exams of Object.values(lib.mocks||{})){
    for(const [exam,data] of Object.entries(exams||{})){
      if(hasMock(data))counts[exam]=(counts[exam]||0)+1;
    }
  }
  return Object.entries(counts)
    .map(([exam,count])=>({exam,count,meta:lib.imports[exam]||{}}))
    .sort((a,b)=>examMonthNum(a.exam)-examMonthNum(b.exam));
}
