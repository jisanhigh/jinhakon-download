name: Build original JinhakON updater (Go / Edge)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/index.html'
      - 'legacy/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install offline SQLite runtime
        run: npm install --no-audit --no-fund
      - name: Bundle HTML and SQLite in original launcher
        shell: pwsh
        run: |
          npm run prepare:vendor
          New-Item -ItemType Directory -Force -Path legacy/launcher/vendor | Out-Null
          Copy-Item app/index.html legacy/launcher/index.html -Force
          Copy-Item app/vendor/sql-asm.js legacy/launcher/vendor/sql-asm.js -Force
      - name: Compile original launcher and in-place installer
        shell: pwsh
        run: |
          Push-Location legacy/launcher
          go build -trimpath -ldflags '-H windowsgui -s -w' -o JinhakON.exe .
          Pop-Location
          Copy-Item legacy/launcher/JinhakON.exe legacy/installer/JinhakON.exe -Force
          Push-Location legacy/installer
          go build -trimpath -ldflags '-H windowsgui -s -w' -o JinhakON_Setup_1.0.5_OriginalUpdate.exe .
          Pop-Location
      - name: Verify installer and include instructions
        shell: pwsh
        run: |
          if ((Get-Item legacy/installer/JinhakON_Setup_1.0.5_OriginalUpdate.exe).Length -lt 5000000) { throw 'Unexpected installer size' }
          Copy-Item docs/ORIGINAL_UPDATE.md legacy/installer/ORIGINAL_UPDATE_README.md -Force
      - uses: actions/upload-artifact@v4
        with:
          name: JinhakON_Setup_1.0.5_OriginalUpdate
          path: |
            legacy/installer/JinhakON_Setup_1.0.5_OriginalUpdate.exe
            legacy/installer/ORIGINAL_UPDATE_README.md
          if-no-files-found: error
