name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify bundled SQLite source
        run: |
          npm run prepare:vendor
          node --check electron/main.cjs
          node -e "const fs=require('fs');if(fs.statSync('app/vendor/sql-asm.js').size<100000)process.exit(1)"
      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload unsigned installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: JinhakON_Setup_1.0.4_TEST
          path: dist/JinhakON_Setup_1.0.4.exe
          if-no-files-found: error
