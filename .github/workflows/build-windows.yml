name: Build and publish JinhakON v1.0.5 (original Go / Edge)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/index.html'
      - 'legacy/**'
      - 'scripts/**'
      - 'package.json'
      - 'docs/RELEASE_NOTES_1.0.5.md'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install offline SQLite runtime
        run: npm install --no-audit --no-fund
      - name: Bundle HTML and SQLite in original launcher
        shell: pwsh
        run: |
          npm run prepare:vendor
          New-Item -ItemType Directory -Force -Path legacy/launcher/vendor | Out-Null
          Copy-Item app/index.html legacy/launcher/index.html -Force
          Copy-Item app/vendor/sql-asm.js legacy/launcher/vendor/sql-asm.js -Force
      - name: Compile original launcher and existing-path installer
        shell: pwsh
        run: |
          Push-Location legacy/launcher
          go build -trimpath -ldflags '-H windowsgui -s -w' -o JinhakON.exe .
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          Pop-Location
          Copy-Item legacy/launcher/JinhakON.exe legacy/installer/JinhakON.exe -Force
          Push-Location legacy/installer
          go build -trimpath -ldflags '-H windowsgui -s -w' -o JinhakON_Setup_1.0.5.exe .
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Pop-Location
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $exe='legacy/installer/JinhakON_Setup_1.0.5.exe'
          if ((Get-Item $exe).Length -lt 5000000) { throw 'Unexpected installer size' }
          $header=[IO.File]::ReadAllBytes($exe)[0..1]
          if ($header[0] -ne 77 -or $header[1] -ne 90) { throw 'Not a Windows executable' }
          (Get-FileHash $exe -Algorithm SHA256) | Format-List
      - name: Upload reproducible installation archive
        uses: actions/upload-artifact@v4
        with:
          name: JinhakON_Setup_1.0.5
          path: |
            legacy/installer/JinhakON_Setup_1.0.5.exe
            docs/ORIGINAL_UPDATE.md
          if-no-files-found: error
      - name: Publish official GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer='legacy/installer/JinhakON_Setup_1.0.5.exe'
          gh release view v1.0.5 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.5 "$installer" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v1.0.5 "$installer" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "진학ON v1.0.5" --notes-file "docs/RELEASE_NOTES_1.0.5.md" --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Official release publishing failed" }
          gh release view v1.0.5 --repo "$env:GITHUB_REPOSITORY" --json tagName,isLatest,url,assets
          if ($LASTEXITCODE -ne 0) { throw "Release verification failed" }
